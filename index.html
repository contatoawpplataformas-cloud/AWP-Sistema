function SimNaoSelect({value, onChange, options}){
  const opts = options || ['Sim','Não'];
  return (
    <select value={value} onChange={e=>onChange(e.target.value)}>
      <option value="">—</option>
      {opts.map(o=><option key={o} value={o}>{o}</option>)}
    </select>
  );
}

function OsForm({proposals, settings, initial, onCancel, onSave, notify, currentUser}){
  const [os, setOs] = useState(initial);
  const [showPreview, setShowPreview] = useState(false);
  const set = (k,v) => setOs(o=>({...o, [k]:v}));

  const linkedProposal = proposals.find(p=>p.id===os.propostaId);

  const selectProposta = (id) => {
    const p = proposals.find(x=>x.id===id);
    if(p){
      const firstItem = p.itens[0];
      setOs(o=>({
        ...o, propostaId:id,
        cliente: p.cliente.razaoSocial,
        contato: p.cliente.responsavel || p.cliente.telefone || '',
        cidade: parseCidadeFromEndereco(p.cliente.endereco),
        equipamento: firstItem ? `${firstItem.tipo} – ${firstItem.modelo}` : o.equipamento,
        patrimonio: firstItem && firstItem.patrimonio ? firstItem.patrimonio : o.patrimonio
      }));
    } else {
      setOs(o=>({...o, propostaId:''}));
    }
  };

  const selectEquipamentoDaProposta = (label) => {
    const item = linkedProposal && linkedProposal.itens.find(it => `${it.tipo} – ${it.modelo}` === label);
    setOs(o=>({...o, equipamento: label, patrimonio: item && item.patrimonio ? item.patrimonio : o.patrimonio}));
  };

  const updatePeca = (id,k,v) => setOs(o=>({...o, pecas: o.pecas.map(pc=>pc.id===id?{...pc,[k]:v}:pc)}));
  const addPeca = () => setOs(o=>({...o, pecas:[...o.pecas, EMPTY_PECA()]}));
  const removePeca = (id) => setOs(o=>({...o, pecas: o.pecas.filter(pc=>pc.id!==id)}));

  const canGenerate = !!os.propostaId && os.cliente.trim().length>0;

  if(showPreview){
    return <OsPreview os={os} settings={settings} onBack={()=>setShowPreview(false)} onConfirmSave={()=>onSave(os)} notify={notify}/>;
  }

  return (
    <div>
      <div className="page-head">
        <div>
          <h1>{initial.id ? `Editar OS nº ${os.numero}` : 'Nova Ordem de Serviço'}</h1>
          <p>Atendimento técnico vinculado a uma locação ativa.</p>
        </div>
        <div style={{display:'flex', gap:8}}>
          <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
          <button className="btn btn-secondary" disabled={!canGenerate} onClick={()=>setShowPreview(true)}>
            <IconEye width="15" height="15"/>Visualizar OS
          </button>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><h2><span className="num">1</span>Vínculo com a locação</h2></div>
        <div className="card-body">
          <div className="field">
            <label>Proposta / contrato de locação *</label>
            <select value={os.propostaId} onChange={e=>selectProposta(e.target.value)}>
              <option value="">— Selecionar proposta —</option>
              {proposals.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(p=>
                <option key={p.id} value={p.id}>#{p.numero} — {p.cliente.razaoSocial}</option>
              )}
            </select>
            <div className="hint">A OS fica atrelada a essa proposta, deixando o atendimento ligado ao contrato de locação.</div>
          </div>
          {linkedProposal && (
            <div className="hint" style={{background:'var(--blue-light)', color:'var(--blue)', padding:'8px 10px', borderRadius:7, marginTop:4}}>
              Locação #{linkedProposal.numero} · {linkedProposal.itens.length} equipamento(s) · Total {fmtMoney(linkedProposal.itens.reduce((s,it)=>s+itemSubtotal(it),0))}
            </div>
          )}
        </div>
      </div>

      <div className="card">
        <div className="card-head"><h2><span className="num">2</span>Dados do atendimento</h2></div>
        <div className="card-body">
          <div className="grid3">
            <div className="field"><label>Data</label><input type="date" value={os.data} onChange={e=>set('data', e.target.value)}/></div>
            <div className="field"><label>Cliente</label><input value={os.cliente} onChange={e=>set('cliente', e.target.value)}/></div>
            <div className="field"><label>Cidade</label><input value={os.cidade} onChange={e=>set('cidade', e.target.value)}/></div>
          </div>
          <div className="grid3">
            <div className="field">
              <label>Equipamento</label>
              {linkedProposal && linkedProposal.itens.length>0 ? (
                <select value={os.equipamento} onChange={e=>selectEquipamentoDaProposta(e.target.value)}>
                  {linkedProposal.itens.map(it=><option key={it.lineId} value={`${it.tipo} – ${it.modelo}`}>{it.tipo} – {it.modelo}</option>)}
                </select>
              ) : (
                <input value={os.equipamento} onChange={e=>set('equipamento', e.target.value)} placeholder="Tipo – Modelo"/>
              )}
            </div>
            <div className="field"><label>Patrimônio</label><input value={os.patrimonio} onChange={e=>set('patrimonio', e.target.value)}/></div>
            <div className="field"><label>Horímetro</label><input value={os.horimetro} onChange={e=>set('horimetro', e.target.value)}/></div>
          </div>
          <div className="field"><label>Contato</label><input value={os.contato} onChange={e=>set('contato', e.target.value)}/></div>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><h2><span className="num">3</span>Diagnóstico</h2></div>
        <div className="card-body">
          <div className="field"><label>Falha detectada pelo cliente</label><textarea rows="2" value={os.falhaDetectada} onChange={e=>set('falhaDetectada', e.target.value)}/></div>
          <div className="grid2">
            <div className="field">
              <label>Equipamento encontrado</label>
              <SimNaoSelect value={os.equipamentoEncontrado} onChange={v=>set('equipamentoEncontrado', v)} options={['Operacional','Não operacional']}/>
            </div>
            <div className="field">
              <label>Chamado decorrente de mau uso do equipamento</label>
              <SimNaoSelect value={os.chamadoMauUso} onChange={v=>set('chamadoMauUso', v)}/>
            </div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <h2><span className="num">4</span>Peças utilizadas</h2>
        </div>
        <div className="card-body">
          <table>
            <thead><tr><th style={{width:80}}>Qtde.</th><th style={{width:140}}>Código</th><th>Descrição</th><th></th></tr></thead>
            <tbody>
              {os.pecas.map(pc=>(
                <tr key={pc.id}>
                  <td><input value={pc.qtde} onChange={e=>updatePeca(pc.id,'qtde',e.target.value)}/></td>
                  <td><input value={pc.codigo} onChange={e=>updatePeca(pc.id,'codigo',e.target.value)}/></td>
                  <td><input value={pc.descricao} onChange={e=>updatePeca(pc.id,'descricao',e.target.value)}/></td>
                  <td><button className="icon-btn del" onClick={()=>removePeca(pc.id)} title="Remover"><IconTrash/></button></td>
                </tr>
              ))}
            </tbody>
          </table>
          <button className="btn btn-secondary btn-sm" style={{marginTop:10}} onClick={addPeca}><IconPlus width="13" height="13"/>Adicionar peça</button>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><h2><span className="num">5</span>Intervenção</h2></div>
        <div className="card-body">
          <textarea rows="4" value={os.intervencao} onChange={e=>set('intervencao', e.target.value)} placeholder="Descreva o serviço realizado..."/>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><h2><span className="num">6</span>Observações</h2></div>
        <div className="card-body">
          <textarea rows="3" value={os.observacoes} onChange={e=>set('observacoes', e.target.value)}/>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><h2><span className="num">7</span>Técnico e encerramento</h2></div>
        <div className="card-body">
          <div className="field" style={{maxWidth:320}}><label>Nome do técnico</label><input value={os.nomeTecnico} onChange={e=>set('nomeTecnico', e.target.value)}/></div>
          <div className="divider"></div>
          <div className="grid3">
            <div className="field"><label>KM saída</label><input value={os.kmSaida} onChange={e=>set('kmSaida', e.target.value)}/></div>
            <div className="field"><label>H. saída</label><input value={os.hSaida} onChange={e=>set('hSaida', e.target.value)}/></div>
            <div className="field"><label>H. início atend.</label><input value={os.hInicioAtend} onChange={e=>set('hInicioAtend', e.target.value)}/></div>
          </div>
          <div className="grid3">
            <div className="field"><label>KM retorno</label><input value={os.kmRetorno} onChange={e=>set('kmRetorno', e.target.value)}/></div>
            <div className="field"><label>H. chegada</label><input value={os.hChegada} onChange={e=>set('hChegada', e.target.value)}/></div>
            <div className="field"><label>H. término</label><input value={os.hTermino} onChange={e=>set('hTermino', e.target.value)}/></div>
          </div>
          <div className="divider"></div>
          <div className="grid4">
            <div className="field"><label>Atendimento finalizado</label><SimNaoSelect value={os.atendimentoFinalizado} onChange={v=>set('atendimentoFinalizado', v)}/></div>
            <div className="field"><label>Retornar</label><SimNaoSelect value={os.retornar} onChange={v=>set('retornar', v)}/></div>
            <div className="field"><label>Equipamento parado</label><SimNaoSelect value={os.equipamentoParado} onChange={v=>set('equipamentoParado', v)}/></div>
            <div className="field"><label>Serviços pendentes</label><SimNaoSelect value={os.servicosPendentes} onChange={v=>set('servicosPendentes', v)}/></div>
          </div>
          <div className="grid3">
            <div className="field"><label>Eqpto. disponível ao fim da visita</label><SimNaoSelect value={os.eqptoDisponivel} onChange={v=>set('eqptoDisponivel', v)}/></div>
            <div className="field"><label>Necessita horas de recarga</label><input value={os.necessitaHoras} onChange={e=>set('necessitaHoras', e.target.value)} placeholder="Ex: 4"/></div>
            <div className="field">
              <label>&nbsp;</label>
              <label style={{display:'flex', alignItems:'center', gap:8, fontWeight:500, fontSize:13.5, marginTop:8}}>
                <input type="checkbox" style={{width:'auto'}} checked={os.clienteAusente} onChange={e=>set('clienteAusente', e.target.checked)}/>
                Cliente não estava presente no término
              </label>
            </div>
          </div>
        </div>
      </div>

      <div style={{display:'flex', justifyContent:'flex-end', gap:8, marginTop:18}}>
        <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
        <button className="btn btn-secondary" disabled={!canGenerate} onClick={()=>setShowPreview(true)}>
          <IconEye width="15" height="15"/>Visualizar OS
        </button>
      </div>
    </div>
  );
}

function CheckBox({checked}){
  return <span className="box">{checked ? 'X' : ''}</span>;
}

function OrdensServicoTab({proposals, settings, currentUser, os, onSaveOs, onDeleteOs, notify}){
  const [mode, setMode] = useState('list');
  const [current, setCurrent] = useState(null);
  const [query, setQuery] = useState('');
  const [confirmDel, setConfirmDel] = useState(null);

  const filtered = os
    .slice()
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
    .filter(o => (o.cliente||'').toLowerCase().includes(query.toLowerCase()) || String(o.numero).includes(query));

  if(mode==='new'){
    return <OsForm
      proposals={proposals} settings={settings} currentUser={currentUser}

      onSave={(o)=>{ onSaveOs(o); setMode('list'); notify(`OS nº ${o.numero} salva com sucesso.`); }}

    return <OsForm
      proposals={proposals} settings={settings} currentUser={currentUser}

      onCancel={()=>setMode('list')}
      notify={notify}
      onSave={(o)=>{ onSaveOs(o); setMode('list'); notify(`OS nº ${o.numero} atualizada.`); }}

  }
  if(mode==='view' && current){
    return <OsViewer current={current} settings={settings} onBack={()=>setMode('list')} notify={notify}
      onDuplicate={()=>{
        const dup = {...current, id:null, numero:String(settings.nextOsNumber||1), data: todayISO(), createdAt:null,
          pecas: current.pecas.map(pc=>({...pc, id:uid()}))};
        setCurrent(dup); setMode('edit');

    />;
  }

  return (
    <div>
      <div className="page-head">
        <div>
          <h1>Ordens de Serviço</h1>
          <p>Atendimentos técnicos vinculados às locações ativas.</p>

        <input placeholder="Buscar por nº ou cliente..." value={query} onChange={e=>setQuery(e.target.value)}/>

      <div className="card">
        {filtered.length===0 ? (
          <div className="empty-state">
            <IconClipboardCheck/>
            <p>{os.length===0 ? 'Nenhuma ordem de serviço registrada ainda.' : 'Nenhuma OS encontrada para essa busca.'}</p>
            {os.length===0 && <button className="btn btn-secondary" onClick={()=>setMode('new')}>Abrir primeira OS</button>}
          </div>
        ) : (
          <table className="rtable">
            <thead><tr><th>Nº</th><th>Cliente</th><th>Equipamento</th><th>Data</th><th>Status</th><th></th></tr></thead>
            <tbody>
              {filtered.map(o=>(
                <tr key={o.id}>
                  <td className="mono" data-label="Nº">#{o.numero}</td>
                  <td data-label="Cliente"><b>{o.cliente}</b></td>

const STATUS_COLOR_VAR = {
  'Aguardando retorno cliente': 'var(--orange-dark)',
  'Efetivada em andamento': 'var(--blue)',
  'Cancelada': 'var(--danger)',
  'Concluída': 'var(--good)',
};

function proposalTotal(p){
  return (p.itens||[]).reduce((s,it)=> s + itemSubtotal(it), 0);
}
function proposalBreakdown(p){
  return (p.itens||[]).reduce((acc, it) => {
    acc.locacao += parseMoneyInput(it.valorLocacao);
    acc.seguro += parseMoneyInput(it.seguro);
    acc.frete += parseMoneyInput(it.frete);
    return acc;
  }, {locacao:0, seguro:0, frete:0});
}
function statsFor(proposals){
  const count = proposals.length;
  const total = proposals.reduce((s,p)=> s + proposalTotal(p), 0);
  const avg = count ? total/count : 0;
  const breakdown = proposals.reduce((acc,p)=>{
    const b = proposalBreakdown(p);
    acc.locacao += b.locacao; acc.seguro += b.seguro; acc.frete += b.frete;
    return acc;
  }, {locacao:0, seguro:0, frete:0});
  return {count, total, avg, breakdown};
}

function StatCard({title, stats, colorVar}){
  return (
    <div className="card stat-card" style={{borderTopColor: colorVar || 'var(--border)'}}>
      <div className="card-body">
        <div className="stat-card-title">{title}</div>
        <div className="stat-card-count">{stats.count}</div>
        <div className="stat-row"><span>Valor médio</span><b>{fmtMoney(stats.avg)}</b></div>
        <div className="stat-row"><span>Valor total</span><b>{fmtMoney(stats.total)}</b></div>
      </div>
    </div>
  );
}

  const breakdownTotal = (b.locacao + b.seguro + b.frete) || 0;

  const sublocProps = proposals.filter(p => p.sublocacao);
  const sublocStats = statsFor(sublocProps);
  const sublocQtdMaquinas = sublocProps.reduce((s,p)=> s + (p.itens||[]).reduce((si,it)=> si + (parseInt(it.qtd)||1), 0), 0);

  return (
    <div>

      </div>

      <div className="stat-hero">
        <div className="label">Total de propostas (todos os status)</div>
        <div className="row">
          <div><div className="big">{all.count}</div><div className="small">propostas</div></div>
          <div><div className="big">{fmtMoney(all.avg)}</div><div className="small">valor médio por proposta</div></div>
          <div><div className="big">{fmtMoney(all.total)}</div><div className="small">valor total geral</div></div>
        </div>
      </div>

      {/* Faturamento por tipo: locação, seguro, frete */}
      <div className="card" style={{marginBottom:16}}>
        <div className="card-head"><h2>Faturamento por tipo</h2></div>
        <div className="card-body">
          <div className="stats-grid">
            <div className="card stat-card" style={{borderTopColor:'var(--blue)'}}>
              <div className="card-body">
                <div className="stat-card-title">Locação</div>
                <div className="stat-row"><span>Valor total</span><b>{fmtMoney(b.locacao)}</b></div>
                <div className="stat-row"><span>% do faturamento</span><b>{breakdownTotal ? (b.locacao/breakdownTotal*100).toFixed(1) : '0.0'}%</b></div>
              </div>
            </div>
            <div className="card stat-card" style={{borderTopColor:'var(--good)'}}>
              <div className="card-body">
                <div className="stat-card-title">Seguro</div>
                <div className="stat-row"><span>Valor total</span><b>{fmtMoney(b.seguro)}</b></div>
                <div className="stat-row"><span>% do faturamento</span><b>{breakdownTotal ? (b.seguro/breakdownTotal*100).toFixed(1) : '0.0'}%</b></div>
              </div>
            </div>
            <div className="card stat-card" style={{borderTopColor:'var(--orange)'}}>
              <div className="card-body">
                <div className="stat-card-title">Frete</div>
                <div className="stat-row"><span>Valor total</span><b>{fmtMoney(b.frete)}</b></div>
                <div className="stat-row"><span>% do faturamento</span><b>{breakdownTotal ? (b.frete/breakdownTotal*100).toFixed(1) : '0.0'}%</b></div>
              </div>
            </div>
          </div>
          {breakdownTotal > 0 && (
            <div style={{marginTop:14}}>
              <div className="value-bar">
                {b.locacao>0 && <div style={{width:`${b.locacao/breakdownTotal*100}%`, background:'var(--blue)'}} title={`Locação: ${(b.locacao/breakdownTotal*100).toFixed(1)}%`}></div>}
                {b.seguro>0 && <div style={{width:`${b.seguro/breakdownTotal*100}%`, background:'var(--good)'}} title={`Seguro: ${(b.seguro/breakdownTotal*100).toFixed(1)}%`}></div>}
                {b.frete>0 && <div style={{width:`${b.frete/breakdownTotal*100}%`, background:'var(--orange)'}} title={`Frete: ${(b.frete/breakdownTotal*100).toFixed(1)}%`}></div>}

              </div>
            </div>
          )}
        </div>
      </div>

      {/* Sublocação (máquinas de terceiro) */}
      <div className="card" style={{marginBottom:16}}>
        <div className="card-head"><h2>Sublocação — máquinas de terceiro</h2></div>
        <div className="card-body">
          <div className="stat-hero" style={{background:'#F1E8FB', border:'1px solid #E0CCF5', color:'#3D2159'}}>

              <div><div className="big" style={{color:'#7B3FBF'}}>{fmtMoney(sublocStats.total)}</div><div className="small" style={{color:'#8A5FB0'}}>valor total envolvido</div></div>

      </div>

      {totalValorGeral > 0 && (
        <div className="card" style={{marginBottom:16}}>

            <div className="value-bar">
              {STATUS_OPTIONS.map(s => {
                const pct = totalValorGeral ? (byStatus[s].total/totalValorGeral*100) : 0;
                return pct>0 ? <div key={s} style={{width:`${pct}%`, background:STATUS_COLOR_VAR[s]}} title={`${s}: ${pct.toFixed(1)}%`}></div> : null;
              })}
            </div>
            <div className="value-bar-legend">
              {STATUS_OPTIONS.map(s=>{
                const pct = totalValorGeral ? (byStatus[s].total/totalValorGeral*100) : 0;

                    {s} <b>{pct.toFixed(1)}%</b>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      <div className="stats-grid">
        {STATUS_OPTIONS.map(s => (
          <StatCard key={s} title={s} stats={byStatus[s]} colorVar={STATUS_COLOR_VAR[s]}/>
        ))}
      </div>
    </div>
  );
}

/* FATURA DE LOCAÇÃO — gerada automaticamente a cada proposta (e renovação) */
/* ==================================================================== */
const FATURA_STATUS_OPTIONS = ['Pendente', 'Paga', 'Vencida', 'Cancelada'];
const FATURA_STATUS_CLASS = {
  'Pendente': 'badge-orange',
  'Paga': 'badge-green',
  'Vencida': 'badge-red',
  'Cancelada': 'badge-gray',
};
function FaturaStatusBadge({status}){
  const s = status || FATURA_STATUS_OPTIONS[0];
  return <span className={`badge ${FATURA_STATUS_CLASS[s] || 'badge-gray'}`}>{s}</span>;
}

function calcularVencimento(dataEmissaoISO, condicaoPagamento){
  const m = (condicaoPagamento||'').match(/(\d+)\s*DDE/i);
  if(!m) return '';
  const dias = parseInt(m[1]);
  const d = new Date(dataEmissaoISO + 'T00:00:00');
  d.setDate(d.getDate() + dias);
  return d.toISOString().slice(0,10);
}

// Monta uma fatura pronta a partir de uma proposta — chamada automaticamente sempre que uma proposta é criada
function gerarFaturaDeProposta(prop, settings){
  const dataEmissao = todayISO();
  const totalLocacao = (prop.itens||[]).reduce((s,it)=> s + parseMoneyInput(it.valorLocacao), 0);
  const totalSeguro = (prop.itens||[]).reduce((s,it)=> s + parseMoneyInput(it.seguro), 0);
  const totalFrete = (prop.itens||[]).reduce((s,it)=> s + parseMoneyInput(it.frete), 0);
  return {
    id: null,
    numero: `FL-${new Date().getFullYear()}-${String(settings.nextFaturaNumber||1).padStart(4,'0')}`,
    propostaId: prop.id,
    propostaNumero: prop.numero,
    dataEmissao,
    dataVencimento: calcularVencimento(dataEmissao, settings.defaultPagamento||''),
    condicaoPagamento: (prop.pagamento||settings.defaultPagamento||'').split(',')[0].trim(),
    referencia: `Contrato nº ${prop.numeroBase||prop.numero} / Proposta nº ${prop.numero}`,
    cliente: {
      razaoSocial: prop.cliente.razaoSocial, cnpj: prop.cliente.cnpj,
      localObra: prop.cliente.endereco, responsavel: prop.cliente.responsavel, telefone: prop.cliente.telefone
    },
    equipamentos: (prop.itens||[]).map(it => ({
      qtd: it.qtd, equipamento: it.tipo, modelo: it.modelo, serie: it.numeroSerie || '',
      periodo: `${fmtDateBR(it.periodoInicio)} a ${fmtDateBR(it.periodoFim)}`,
      valor: parseMoneyInput(it.valorLocacao)
    })),
    valorLocacao: totalLocacao,
    seguroValor: totalSeguro,
    seguroTexto: totalSeguro>0 ? '' : 'Não contratado',
    freteValor: totalFrete,
    freteTexto: totalFrete>0 ? '' : (prop.transporte || 'Por conta do cliente'),
    totalGeral: totalLocacao + totalSeguro + totalFrete,
    dadosPagamento: settings.defaultDadosPagamento || 'Via boleto bancário em anexo.',
    observacoes: settings.defaultObservacoesFatura || '',
    status: FATURA_STATUS_OPTIONS[0],
    createdAt: null
  };
}

      <div style={{textAlign:'center', marginBottom:14}}>

        <div style={{fontSize:11, color:'#5B6472', marginTop:8}}>{settings.tagline}</div>
      </div>
      <div style={{textAlign:'center', marginBottom:4}}>
        <div className="doc-title" style={{fontSize:21}}>FATURA DE LOCAÇÃO</div>

function FaturasTab({faturas, settings, notify, onSaveFatura, onDeleteFatura, openFaturaId, onConsumeOpenFatura}){
  const [mode, setMode] = useState('list');
  const [current, setCurrent] = useState(null);
  const [query, setQuery] = useState('');
  const [statusFilter, setStatusFilter] = useState('todos');
  const [confirmDel, setConfirmDel] = useState(null);

  useEffect(()=>{
    if(openFaturaId){
      const f = faturas.find(x=>x.id===openFaturaId);
      if(f){
        setCurrent(f); setMode('view');
        onConsumeOpenFatura && onConsumeOpenFatura();
      }
      // se ainda não achou (nuvem sincronizando), não consome — tenta de novo quando "faturas" atualizar
    }
  }, [openFaturaId, faturas]);

  const filtered = faturas.slice()
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))
    .filter(f => (f.cliente.razaoSocial||'').toLowerCase().includes(query.toLowerCase()) || String(f.numero).toLowerCase().includes(query.toLowerCase()))
    .filter(f => statusFilter==='todos' || (f.status||FATURA_STATUS_OPTIONS[0])===statusFilter);

  const changeStatusQuick = (f, newStatus) => {
    onSaveFatura({...f, status:newStatus});
    notify(`Status da fatura ${f.numero} atualizado.`);
  };

  if(mode==='edit' && current){
    return <FaturaForm fatura={current} onCancel={()=>setMode('list')} notify={notify}
      onSave={(f)=>{ onSaveFatura(f); setMode('list'); notify(`Fatura ${f.numero} salva.`); }}/>;
  }
  if(mode==='view' && current){
    return <FaturaViewer fatura={current} settings={settings} onBack={()=>setMode('list')} notify={notify}
      onEdit={()=>setMode('edit')}/>;
  }

  return (
    <div>
      <div className="page-head">
        <div><h1>Faturas</h1><p>Geradas automaticamente a cada proposta, para controle financeiro centralizado.</p></div>
      </div>

      <div className="search-row">
        <IconSearch width="16" height="16" style={{color:'var(--muted)'}}/>
        <input placeholder="Buscar por nº ou cliente..." value={query} onChange={e=>setQuery(e.target.value)}/>
      </div>
      <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{marginBottom:14, maxWidth:220}}>
        <option value="todos">Todos os status</option>
        {FATURA_STATUS_OPTIONS.map(s=><option key={s} value={s}>{s}</option>)}
      </select>

      <div className="card">
        {filtered.length===0 ? (
          <div className="empty-state">
            <IconReceipt/>
            <p>{faturas.length===0 ? 'Nenhuma fatura gerada ainda — elas aparecem automaticamente quando você cria uma proposta.' : 'Nenhuma fatura encontrada para essa busca.'}</p>
          </div>
        ) : (
          <table className="rtable">
            <thead><tr><th>Nº</th><th>Cliente</th><th>Vencimento</th><th>Status</th><th>Total</th><th></th></tr></thead>
            <tbody>
              {filtered.map(f=>(
                <tr key={f.id}>
                  <td className="mono" data-label="Nº">{f.numero}<div className="hint">Proposta nº {f.propostaNumero}</div></td>
                  <td data-label="Cliente"><b>{f.cliente.razaoSocial}</b></td>
                  <td data-label="Vencimento">{fmtDateBR(f.dataVencimento)}</td>
                  <td data-label="Status">
                    <select value={f.status||FATURA_STATUS_OPTIONS[0]} onChange={e=>changeStatusQuick(f, e.target.value)} style={{fontSize:12, padding:'4px 6px'}}>
                      {FATURA_STATUS_OPTIONS.map(s=><option key={s} value={s}>{s}</option>)}
                    </select>
                  </td>
                  <td className="mono" data-label="Total">{fmtMoney(f.totalGeral)}</td>
                  <td className="actions-cell">
                    <div className="row-actions">
                      <button className="icon-btn" title="Visualizar" onClick={()=>{setCurrent(f); setMode('view');}}><IconEye/></button>
                      <button className="icon-btn" title="Editar" onClick={()=>{setCurrent(f); setMode('edit');}}><IconEdit/></button>
                      <button className="icon-btn del" title="Excluir" onClick={()=>setConfirmDel(f)}><IconTrash/></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      <ConfirmModal
        open={!!confirmDel}
        title="Excluir fatura"
        text={confirmDel ? `Tem certeza que deseja excluir a fatura ${confirmDel.numero} (${confirmDel.cliente.razaoSocial})?` : ''}
        onConfirm={()=>{ onDeleteFatura(confirmDel.id); notify('Fatura excluída.'); setConfirmDel(null); }}
        onCancel={()=>setConfirmDel(null)}
      />
    </div>
  );
}

function ConfigTab({settings, onSave, notify, fullData, onRestore, onMerge, cloudStatus}){
  const [form, setForm] = useState(settings);
  const set = (k,v) => setForm(f=>({...f, [k]:v}));
  const [pasteText, setPasteText] = useState('');
  const [confirmRestore, setConfirmRestore] = useState(null); // parsed object pending confirmation
  const [confirmWipe, setConfirmWipe] = useState(false);
  const fileInputRef = useRef(null);

  const exportJson = () => JSON.stringify(fullData, null, 2);

  const copyData = async () => {
    try{
      await navigator.clipboard.writeText(exportJson());
      notify('Dados copiados! Cole no sistema atualizado para transferir.');
    }catch(e){
      notify('Não foi possível copiar automaticamente. Selecione o texto manualmente.');
    }
  };

  const downloadData = () => {
    const blob = new Blob([exportJson()], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `awp-locacao-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    notify('Backup baixado.');
  };

  const parseAndStage = (text) => {
    try{
      const parsed = JSON.parse(text);
      if(typeof parsed !== 'object' || parsed===null) throw new Error('formato inválido');
      setConfirmRestore(parsed);
    }catch(e){
      notify('Não foi possível ler os dados colados. Confira se copiou o JSON completo.');
    }
  };

  const handleFile = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => parseAndStage(reader.result);
    reader.readAsText(file);
    e.target.value = '';
  };

  const countOf = (obj, key) => Array.isArray(obj[key]) ? obj[key].length : 0;

  return (
    <div>
      <div className="page-head">
        <div>
          <h1>Configurações</h1>
          <p>Dados padrão usados na geração das propostas.</p>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><h2>Sincronização em nuvem</h2></div>
        <div className="card-body">
          {cloudStatus==='online' && (
            <div style={{display:'flex', alignItems:'center', gap:10, background:'#E4F5EC', border:'1px solid #BFE8D2', borderRadius:8, padding:'12px 14px'}}>
              <span className="sync-dot online" style={{width:10,height:10}}></span>
              <div>
                <b style={{color:'var(--good)', fontSize:13}}>Conectado — sincronizando em tempo real</b>
                <p style={{margin:'2px 0 0', fontSize:12, color:'var(--muted)'}}>Tudo que você, Lucio ou Marcos cadastrarem aparece automaticamente para os outros dois.</p>
              </div>
            </div>
          )}
          {cloudStatus==='connecting' && (
            <div style={{display:'flex', alignItems:'center', gap:10, background:'#FDF6E3', border:'1px solid #F2E2A8', borderRadius:8, padding:'12px 14px'}}>
              <span className="sync-dot connecting" style={{width:10,height:10}}></span>
              <b style={{color:'var(--orange-dark)', fontSize:13}}>Conectando à nuvem...</b>
            </div>
          )}
          {cloudStatus==='error' && (
            <div style={{display:'flex', alignItems:'center', gap:10, background:'#FBEAE8', border:'1px solid #F3C6C1', borderRadius:8, padding:'12px 14px'}}>
              <span className="sync-dot error" style={{width:10,height:10}}></span>
              <div>
                <b style={{color:'var(--danger)', fontSize:13}}>Erro ao conectar à nuvem</b>
                <p style={{margin:'2px 0 0', fontSize:12, color:'var(--muted)'}}>Usando dados salvos localmente neste aparelho por enquanto. Verifique sua internet e recarregue a página.</p>
              </div>
            </div>
          )}
          {cloudStatus==='local' && (
            <div style={{display:'flex', alignItems:'center', gap:10, background:'#F2F5FA', border:'1px solid var(--border)', borderRadius:8, padding:'12px 14px'}}>
              <span className="sync-dot local" style={{width:10,height:10}}></span>
              <div>
                <b style={{fontSize:13}}>Modo local — sem sincronização entre pessoas</b>
                <p style={{margin:'2px 0 0', fontSize:12, color:'var(--muted)'}}>Os dados ficam salvos só neste aparelho. Fale com quem administra o sistema para ativar a sincronização em nuvem entre Walter, Lucio e Marcos.</p>
              </div>
            </div>
          )}
        </div>
      </div>

      <div className="card">
        <div className="card-head"><h2>Backup e transferência de dados</h2></div>
        <div className="card-body">
          <p style={{fontSize:12.5, color:'var(--muted)', margin:'0 0 14px', lineHeight:1.5}}>
            Use isto para levar dados para uma nova versão do sistema, ou para adicionar um lote de cadastros novos (ex: clientes pesquisados fora do sistema) sem apagar o que já existe.
          </p>
          <div style={{display:'flex', gap:8, flexWrap:'wrap', marginBottom:18}}>
            <button className="btn btn-secondary" onClick={copyData}><IconClipboard width="15" height="15"/>Copiar dados</button>
            <button className="btn btn-secondary" onClick={downloadData}><IconDownload width="15" height="15"/>Baixar backup (.json)</button>
          </div>

          <div className="divider"></div>

          <div className="field">
            <label>Importar dados colados (backup ou lote de cadastros)</label>
            <textarea rows="4" placeholder="Cole aqui o JSON com os dados a importar..." value={pasteText} onChange={e=>setPasteText(e.target.value)}/>
          </div>
          <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
            <button className="btn btn-secondary" disabled={!pasteText.trim()} onClick={()=>parseAndStage(pasteText)}>
              <IconUpload width="15" height="15"/>Importar dados colados
            </button>
            <button className="btn btn-ghost" onClick={()=>fileInputRef.current.click()}>
              <IconUpload width="15" height="15"/>Importar arquivo .json
            </button>
            <input ref={fileInputRef} type="file" accept="application/json" style={{display:'none'}} onChange={handleFile}/>
          </div>

          <div className="divider"></div>

          <div style={{background:'#FBEAE8', border:'1px solid #F3C6C1', borderRadius:8, padding:'12px 14px'}}>
            <div style={{fontSize:12.5, fontWeight:700, color:'var(--danger)', marginBottom:4}}>Zona de risco</div>
            <p style={{fontSize:12, color:'var(--muted)', margin:'0 0 10px', lineHeight:1.5}}>
              Apaga todos os clientes, máquinas, propostas e OS deste sistema, deixando tudo zerado. Faça um backup antes, se quiser guardar algo.
            </p>
            <button className="btn btn-sm" style={{background:'#fff', border:'1px solid var(--danger)', color:'var(--danger)'}} onClick={()=>setConfirmWipe(true)}>
              <IconTrash width="14" height="14"/>Zerar todos os dados
            </button>
          </div>
        </div>
      </div>

      <ConfirmModal
        open={confirmWipe}
        title="Zerar todos os dados"
        text="Isso vai apagar TODOS os clientes, máquinas, propostas, OS e faturas cadastrados, sem volta. Recomendado só depois de confirmar que você já baixou um backup, se precisar dele."
        onConfirm={()=>{
          onRestore({clients:[], machines:[], proposals:[], os:[], faturas:[]});
          setConfirmWipe(false);
          notify('Sistema zerado. Pronto para começar do zero.');
        }}
        onCancel={()=>setConfirmWipe(false)}
      />

      {confirmRestore && (
        <div className="modal-backdrop" onClick={()=>setConfirmRestore(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h3>Importar dados</h3>
            <p>
              O arquivo contém: {countOf(confirmRestore,'clients')} cliente(s), {countOf(confirmRestore,'machines')} máquina(s), {countOf(confirmRestore,'proposals')} proposta(s), {countOf(confirmRestore,'os')} OS, {countOf(confirmRestore,'faturas')} fatura(s){confirmRestore && confirmRestore.users ? `, ${confirmRestore.users.length} usuário(s) com senha` : ''}.<br/><br/>
              Escolha como aplicar: <b>Mesclar</b> adiciona esses registros aos que já existem (sem apagar nada). <b>Substituir tudo</b> troca completamente os dados atuais por estes.
            </p>
            <div className="row" style={{flexWrap:'wrap'}}>
              <button className="btn btn-ghost" onClick={()=>setConfirmRestore(null)}>Cancelar</button>
              <button className="btn btn-secondary" onClick={()=>{
                onMerge(confirmRestore);
                setConfirmRestore(null);
                setPasteText('');
                notify('Dados mesclados com sucesso — nada foi apagado.');
              }}><IconCheck width="15" height="15"/>Mesclar (adicionar)</button>
              <button className="btn btn-primary" onClick={()=>{
                onRestore(confirmRestore);
                setConfirmRestore(null);
                setPasteText('');
                notify('Dados restaurados com sucesso.');
              }}>Substituir tudo</button>
            </div>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-head"><h2>Identidade e rodapé do documento</h2></div>
        <div className="card-body">
          <div className="grid2">
            <div className="field"><label>Nome exibido (marca)</label><input value={form.brandName} onChange={e=>set('brandName', e.target.value)}/></div>
            <div className="field"><label>Slogan / tagline</label><input value={form.tagline} onChange={e=>set('tagline', e.target.value)}/></div>
          </div>
          <div className="grid2">
            <div className="field"><label>Razão social (rodapé)</label><input value={form.companyName} onChange={e=>set('companyName', e.target.value)}/></div>
            <div className="field"><label>CNPJ (rodapé)</label><input value={form.companyCnpj} onChange={e=>set('companyCnpj', e.target.value)}/></div>
          </div>
          <div className="field"><label>Endereço (rodapé)</label><input value={form.companyAddress} onChange={e=>set('companyAddress', e.target.value)}/></div>
          <div className="grid2">
            <div className="field"><label>E-mail (usado na OS)</label><input value={form.companyEmail} onChange={e=>set('companyEmail', e.target.value)}/></div>
            <div className="field"><label>Telefone/Celular (usado na OS)</label><input value={form.companyPhone} onChange={e=>set('companyPhone', e.target.value)}/></div>
          </div>
        </div>
      </div>


      <div className="card">
        <div className="card-head"><h2>Padrões de proposta</h2></div>
        <div className="card-body">
          <div className="grid3">
            <div className="field"><label>Próximo número de proposta</label><input type="number" value={form.nextProposalNumber} onChange={e=>set('nextProposalNumber', parseInt(e.target.value)||1)}/></div>
            <div className="field"><label>Próximo número de OS</label><input type="number" value={form.nextOsNumber} onChange={e=>set('nextOsNumber', parseInt(e.target.value)||1)}/></div>
            <div className="field"><label>Consultor padrão</label><input value={form.defaultConsultor} onChange={e=>set('defaultConsultor', e.target.value)}/></div>
          </div>
          <div className="field"><label>Validade padrão</label><input value={form.defaultValidade} onChange={e=>set('defaultValidade', e.target.value)}/></div>
          <div className="grid3">
            <div className="field"><label>Transporte padrão</label><input value={form.defaultTransporte} onChange={e=>set('defaultTransporte', e.target.value)}/></div>
            <div className="field"><label>Prazo de entrega padrão</label><input value={form.defaultPrazoEntrega} onChange={e=>set('defaultPrazoEntrega', e.target.value)}/></div>
            <div className="field"><label>Condições de pagamento padrão</label><input value={form.defaultPagamento} onChange={e=>set('defaultPagamento', e.target.value)}/></div>
          </div>
          <div className="field"><label>Texto padrão — Entrega técnica / treinamento / assistência</label><textarea rows="5" value={form.defaultEntrega} onChange={e=>set('defaultEntrega', e.target.value)}/></div>
          <div className="field"><label>Texto padrão — Devolução e renovação</label><textarea rows="4" value={form.defaultDevolucao} onChange={e=>set('defaultDevolucao', e.target.value)}/></div>
        </div>
        <div className="total-bar" style={{justifyContent:'flex-end', background:'#fff', borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-primary" onClick={()=>{ onSave(form); notify('Configurações salvas.'); }}><IconCheck width="15" height="15"/>Salvar configurações</button>
        </div>
      </div>
    </div>
  );
}

/* APP ROOT */
/* ==================================================================== */
function App(){
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('propostas');
  const [mobileView, setMobileView] = useState('menu'); // 'menu' | 'content' — mobile single-screen navigation
  const [data, setData] = useState({clients:[], machines:[], proposals:[], os:[], faturas:[], users:[...USERS], settings:{...DEFAULT_SETTINGS}});
  const [cloudStatus, setCloudStatus] = useState(FIREBASE_CONFIGURED ? 'connecting' : 'local'); // 'local' | 'connecting' | 'online' | 'error'
  const [openFaturaId, setOpenFaturaId] = useState(null);
  const [toastMsg, notify] = useToast();
  const [currentUser, setCurrentUser] = useState(null);
  const dataRef = useRef(data);
  dataRef.current = data;

  useEffect(()=>{
    const db = getFirebaseDb();
    if(db){
      const docRef = db.collection(FIREBASE_COLLECTION).doc(FIREBASE_DOC);
      const unsubscribe = docRef.onSnapshot(
        (snap) => {
          if(snap.exists){
            setData(normalizeCloudData(snap.data()));
          } else {
            const initial = {clients:[], machines:[], proposals:[], os:[], faturas:[], users:[...USERS], settings:{...DEFAULT_SETTINGS}};
            docRef.set(initial).catch(e=>console.error('Erro ao inicializar doc na nuvem', e));
            setData(initial);
          }
          setCloudStatus('online');
          setLoading(false);
        },
        (err) => {
          console.error('Erro de conexão com Firestore', err);
          setCloudStatus('error');
          (async ()=>{ const d = await loadAppData(); setData(d); setLoading(false); })();
        }
      );
      return () => unsubscribe();
    } else {
      (async ()=>{
        const d = await loadAppData();
        setData(d);
        setLoading(false);
      })();
    }
  }, []);

  const persistAndSet = async (updater) => {
    const db = getFirebaseDb();
    if(db){
      const next = updater(dataRef.current);
      try{
        // Firestore não aceita valores "undefined" — essa conversão remove qualquer campo
        // faltante (ex: registros antigos criados antes de um campo novo existir) sem travar o salvamento.
        const safeNext = JSON.parse(JSON.stringify(next));
        await db.collection(FIREBASE_COLLECTION).doc(FIREBASE_DOC).set(safeNext);
        // o estado local é atualizado automaticamente pelo listener onSnapshot acima
      }catch(e){
        console.error('Erro ao salvar na nuvem', e);
        notify('Erro ao salvar na nuvem — verifique sua conexão.');
      }
      return;
    }
    setData(prev => {
      const next = updater(prev);
      persist(next);
      return next;
    });
  };

  const saveClient = (client) => persistAndSet(prev => {
    const exists = prev.clients.some(c=>c.id===client.id);
    const clients = exists ? prev.clients.map(c=>c.id===client.id?client:c) : [...prev.clients, client];
    return {...prev, clients};
  });
  const deleteClient = (id) => persistAndSet(prev => ({...prev, clients: prev.clients.filter(c=>c.id!==id)}));

  const saveMachine = (machine) => persistAndSet(prev => {
    const exists = prev.machines.some(m=>m.id===machine.id);
    const machines = exists ? prev.machines.map(m=>m.id===machine.id?machine:m) : [...prev.machines, machine];
    return {...prev, machines};
  });
  const deleteMachine = (id) => persistAndSet(prev => ({...prev, machines: prev.machines.filter(m=>m.id!==id)}));

  const saveProposal = (prop) => persistAndSet(prev => {
    const isNew = !prop.id;
    const finalProp = isNew ? {...prop, id: uid(), createdAt: Date.now()} : {...prop, createdAt: prop.createdAt || Date.now()};
    const proposals = isNew ? [...prev.proposals, finalProp] : prev.proposals.map(p=>p.id===finalProp.id?finalProp:p);
    let settings = prev.settings;
    let faturas = prev.faturas;
    if(isNew){
      const usedNum = parseInt(prop.numero);
      const nextNum = (!isNaN(usedNum) && usedNum >= (prev.settings.nextProposalNumber||1)) ? usedNum+1 : (prev.settings.nextProposalNumber||1);
      settings = {...prev.settings, nextProposalNumber: nextNum};
      // Toda proposta nova (incluindo renovações) gera automaticamente sua própria fatura vinculada
      const novaFatura = {...gerarFaturaDeProposta(finalProp, settings), id: uid(), createdAt: Date.now()};
      faturas = [...(prev.faturas||[]), novaFatura];
      settings = {...settings, nextFaturaNumber: (settings.nextFaturaNumber||1) + 1};
    }
    return {...prev, proposals, faturas, settings};
  });
  const deleteProposal = (id) => persistAndSet(prev => ({...prev, proposals: prev.proposals.filter(p=>p.id!==id)}));

  const saveFatura = (f) => persistAndSet(prev => {
    const isNew = !f.id;
    const finalFatura = isNew ? {...f, id: uid(), createdAt: Date.now()} : {...f, createdAt: f.createdAt || Date.now()};
    const faturas = isNew ? [...(prev.faturas||[]), finalFatura] : (prev.faturas||[]).map(x=>x.id===finalFatura.id?finalFatura:x);
    return {...prev, faturas};
  });
  const deleteFatura = (id) => persistAndSet(prev => ({...prev, faturas: (prev.faturas||[]).filter(f=>f.id!==id)}));

  const gerarFaturaParaProposta = (prop) => {
    const novoId = uid();
    persistAndSet(prev => {
      const novaFatura = {...gerarFaturaDeProposta(prop, prev.settings), id: novoId, createdAt: Date.now()};
      const faturas = [...(prev.faturas||[]), novaFatura];
      const settings = {...prev.settings, nextFaturaNumber: (prev.settings.nextFaturaNumber||1) + 1};
      return {...prev, faturas, settings};
    });
    return novoId;
  };

  const saveOs = (o) => persistAndSet(prev => {
    const isNew = !o.id;
    const finalOs = isNew ? {...o, id: uid(), createdAt: Date.now()} : {...o, createdAt: o.createdAt || Date.now()};
    const os = isNew ? [...prev.os, finalOs] : prev.os.map(x=>x.id===finalOs.id?finalOs:x);
    let settings = prev.settings;
    if(isNew){
      const usedNum = parseInt(o.numero);
      const nextNum = (!isNaN(usedNum) && usedNum >= (prev.settings.nextOsNumber||1)) ? usedNum+1 : (prev.settings.nextOsNumber||1);
      settings = {...prev.settings, nextOsNumber: nextNum};
    }
    return {...prev, os, settings};
  });
  const deleteOs = (id) => persistAndSet(prev => ({...prev, os: prev.os.filter(o=>o.id!==id)}));

  const saveSettings = (settings) => persistAndSet(prev => ({...prev, settings}));

  const changePassword = (userName, newPassword) => persistAndSet(prev => {
    const baseUsers = (prev.users && prev.users.length) ? prev.users : USERS;
    const users = baseUsers.map(u => u.name===userName ? {...u, password:newPassword} : u);
    return {...prev, users};
  });

  const restoreData = (incoming) => persistAndSet(prev => ({
    clients: Array.isArray(incoming.clients) ? incoming.clients : prev.clients,
    machines: Array.isArray(incoming.machines) ? incoming.machines : prev.machines,
    proposals: Array.isArray(incoming.proposals) ? incoming.proposals : prev.proposals,
    os: Array.isArray(incoming.os) ? incoming.os : prev.os,
    faturas: Array.isArray(incoming.faturas) ? incoming.faturas : prev.faturas,
    users: Array.isArray(incoming.users) && incoming.users.length ? incoming.users : prev.users,
    settings: incoming.settings ? { ...DEFAULT_SETTINGS, ...incoming.settings } : prev.settings,
  }));

  const mergeData = (incoming) => persistAndSet(prev => {
    const mergeArr = (prevArr, incArr) => {
      if(!Array.isArray(incArr) || incArr.length===0) return prevArr;
      const byId = new Map((prevArr||[]).map(x=>[x.id, x]));
      incArr.forEach(item => {
        const id = item.id || uid();
        byId.set(id, {...item, id});
      });
      return Array.from(byId.values());
    };
    return {
      ...prev,
      clients: mergeArr(prev.clients, incoming.clients),
      machines: mergeArr(prev.machines, incoming.machines),
      proposals: mergeArr(prev.proposals, incoming.proposals),
      os: mergeArr(prev.os, incoming.os),
      faturas: mergeArr(prev.faturas, incoming.faturas),
    };
  });

  if(loading){
    return <div className="loading-screen"><div className="spinner"></div>Carregando sistema...</div>;
  }

  if(!currentUser){
    const loginUsers = (data.users && data.users.length) ? data.users : USERS;
    return <>
      <Login users={loginUsers} onLogin={setCurrentUser} onChangePassword={changePassword} notify={notify}/>
      <div className={`toast ${toastMsg ? 'show' : ''}`}>{toastMsg}</div>
    </>;
  }

  const urgentProposalsCount = data.proposals.filter(p=>isUrgente(p)).length;
  const faturasVencidasCount = (data.faturas||[]).filter(f=>f.status==='Vencida' || (f.status==='Pendente' && f.dataVencimento && f.dataVencimento < todayISO())).length;
  const NAV = [
    {id:'propostas', label:'Propostas', short:'Propostas', icon:IconDoc, count:data.proposals.length, alert:urgentProposalsCount},
    {id:'clientes', label:'Clientes', short:'Clientes', icon:IconUsers, count:data.clients.length},
    {id:'maquinas', label:'Máquinas', short:'Máquinas', icon:IconTruck, count:data.machines.length},
    {id:'ordens', label:'Ordem de Serviço', short:'OS', icon:IconWrench, count:data.os.length},
    {id:'faturas', label:'Faturas', short:'Faturas', icon:IconReceipt, count:(data.faturas||[]).length, alert:faturasVencidasCount},
    {id:'faturamento', label:'Análise de Faturamento', short:'Faturamento', icon:IconBarChart, count:null},
    {id:'config', label:'Configurações', short:'Config', icon:IconSettings, count:null},
  ];
  const currentNavItem = NAV.find(n=>n.id===tab);

  const goToTab = (id) => { setTab(id); setMobileView('content'); };
  const goHome = () => setMobileView('menu');

  return (
    <div id="app-inner" className={`app-shell ${mobileView==='content' ? 'view-content' : 'view-menu'}`} style={{display:'flex', width:'100%'}}>
      <header className="mobile-topbar no-print">
        {mobileView==='content' ? (
          <>
            <button className="mobile-topbar-back" onClick={goHome} title="Voltar ao menu">
              <Icon d="M15 18l-6-6 6-6" width="18" height="18"/>
            </button>
            <span className="mobile-topbar-title">{currentNavItem ? currentNavItem.label : ''}</span>
          </>
        ) : (
          <>
            <img src={LOGO_TRANSPARENT} alt="AWP Plataformas" className="mobile-topbar-logo"/>
            <span className="mobile-topbar-title">Sistema de Locação</span>
          </>
        )}
        <button className="mobile-topbar-user" onClick={()=>setCurrentUser(null)} title="Sair">
          <span className="login-avatar">{currentUser.split(' ').map(p=>p[0]).slice(0,2).join('')}</span>
        </button>
      </header>

      <div className="mobile-home no-print">
        <div className="mobile-home-hero">
          <img src={LOGO_TRANSPARENT} alt="AWP Plataformas" style={{filter:'invert(1) brightness(0.3)'}}/>
          <p>Olá, {currentUser.split(' ')[0]} — o que você precisa fazer?</p>
        </div>
        <div className="mobile-home-grid">
          {NAV.map(n=>{
            const IconC = n.icon;
            return (
              <div key={n.id} className="mobile-home-tile" onClick={()=>goToTab(n.id)} style={{position:'relative'}}>
                {!!n.alert && <span className="tile-alert-dot">{n.alert}</span>}
                <div className="tile-icon"><IconC/></div>
                <span>{n.label}</span>
                {n.count !== null && <span className="tile-count">{n.count} registro(s)</span>}
              </div>
            );
          })}
        </div>
        <button className="mobile-home-logout" onClick={()=>setCurrentUser(null)}>
          <IconLogOut width="15" height="15"/>Sair da conta
        </button>
      </div>

      <aside className="sidebar no-print">
        <div className="brand">
          <img src={LOGO_TRANSPARENT} alt="AWP Plataformas" className="brand-logo-img"/>
          <span className="brand-sub">Sistema de Locação</span>
        </div>
        <nav className="tabs">
          {NAV.map(n=>{
            const IconC = n.icon;
            return (
              <button key={n.id} className={tab===n.id?'active':''} onClick={()=>goToTab(n.id)} style={{position:'relative'}}>
                <IconC/>
                <span className="nav-label-full">{n.label}</span>
                <span className="nav-label-short">{n.short}</span>
                {!!n.alert && <span className="nav-alert-dot">{n.alert}</span>}
              </button>
            );
          })}
        </nav>
        <div className="topbar-user">
          <span className="login-avatar">{currentUser.split(' ').map(p=>p[0]).slice(0,2).join('')}</span>
          <div className="who"><b>{currentUser}</b><span>Logado</span></div>
          <button title="Sair" onClick={()=>setCurrentUser(null)}><IconLogOut width="15" height="15"/></button>
        </div>
        <div className="sidebar-foot">
          <div className="sync-indicator">
            <span className={`sync-dot ${cloudStatus}`}></span>
            {cloudStatus==='online' ? 'Sincronizado na nuvem' : cloudStatus==='connecting' ? 'Conectando...' : cloudStatus==='error' ? 'Erro na nuvem — modo local' : 'Modo local (sem sincronização)'}
          </div>
          {data.settings.companyName}<br/>CNPJ {data.settings.companyCnpj}
        </div>
      </aside>

      <main>
        {tab==='propostas' && <PropostasTab proposals={data.proposals} clients={data.clients} machines={data.machines} settings={data.settings} currentUser={currentUser} faturas={data.faturas} onSaveProposal={saveProposal} onDeleteProposal={deleteProposal} onGoToFatura={(id)=>{ setOpenFaturaId(id); setTab('faturas'); }} onGerarFatura={(prop)=>{ const id = gerarFaturaParaProposta(prop); setOpenFaturaId(id); setTab('faturas'); }} notify={notify}/>}
        {tab==='clientes' && <ClientesTab clients={data.clients} onSave={saveClient} onDelete={deleteClient} notify={notify}/>}
        {tab==='maquinas' && <MaquinasTab machines={data.machines} onSave={saveMachine} onDelete={deleteMachine} notify={notify}/>}
        {tab==='config' && <ConfigTab settings={data.settings} onSave={saveSettings} notify={notify} fullData={data} onRestore={restoreData} onMerge={mergeData} cloudStatus={cloudStatus}/>}
        {tab==='ordens' && <OrdensServicoTab proposals={data.proposals} settings={data.settings} currentUser={currentUser} os={data.os} onSaveOs={saveOs} onDeleteOs={deleteOs} notify={notify}/>}
        {tab==='faturas' && <FaturasTab faturas={data.faturas} settings={data.settings} notify={notify} onSaveFatura={saveFatura} onDeleteFatura={deleteFatura} openFaturaId={openFaturaId} onConsumeOpenFatura={()=>setOpenFaturaId(null)}/>}
        {tab==='faturamento' && <FaturamentoTab proposals={data.proposals}/>}
      </main>

      <div className={`toast ${toastMsg ? 'show' : ''}`}>{toastMsg}</div>
    </div>
  );
}

const SIGNATURES_COLLECTION = 'awp-locacao-signatures';
const SHARED_LINKS_COLLECTION = 'awp-locacao-shared-links';

// Monta só o essencial pra exibir a proposta e coletar a assinatura (não inclui clientes, senhas, outras propostas etc.)
function buildShareablePayload(prop, settings){
  return {
    id: prop.id, numero: prop.numero, data: prop.data, validade: prop.validade, consultor: prop.consultor,
    cliente: prop.cliente,
    itens: (prop.itens||[]).map(it => ({
      modelo: it.modelo, tipo: it.tipo, qtd: it.qtd,
      periodoInicio: it.periodoInicio, periodoFim: it.periodoFim,
      valorLocacao: it.valorLocacao, seguro: it.seguro, frete: it.frete,
      alturaTrabalho: it.alturaTrabalho, alturaPlataforma: it.alturaPlataforma,
      alcanceHorizontal: it.alcanceHorizontal, capacidadeCarga: it.capacidadeCarga,
      dimensoesPeso: it.dimensoesPeso, energia: it.energia
    })),
    transporte: prop.transporte, prazoEntrega: prop.prazoEntrega, pagamento: prop.pagamento,
    textoEntrega: prop.textoEntrega, textoDevolucao: prop.textoDevolucao,
    criadoEm: new Date().toISOString(),
    s: {
      brandName: settings.brandName, tagline: settings.tagline, companyName: settings.companyName,
      companyCnpj: settings.companyCnpj, companyAddress: settings.companyAddress
    }
  };
}

function PublicSignPage({shareId}){
  const [decoded, setDecoded] = useState(null);
  const [decodeError, setDecodeError] = useState(false);
  const [nome, setNome] = useState('');
  const [cpf, setCpf] = useState('');
  const [cargo, setCargo] = useState('');
  const [documento, setDocumento] = useState('');
  const [assinaturaImg, setAssinaturaImg] = useState('');
  const [aceite, setAceite] = useState(false);
  const [error, setError] = useState('');
  const [enviando, setEnviando] = useState(false);
  const [enviado, setEnviado] = useState(false);
  const [desbloqueado, setDesbloqueado] = useState(false);
  const [senhaDigitada, setSenhaDigitada] = useState('');
  const [senhaErro, setSenhaErro] = useState('');

  useEffect(()=>{
    (async ()=>{
      try{
        const db = getFirebaseDb();
        if(!db) throw new Error('Nuvem indisponível.');
        const snap = await db.collection(SHARED_LINKS_COLLECTION).doc(shareId).get();
        if(!snap.exists) throw new Error('Link não encontrado.');
        const d = snap.data();
        setDecoded(d);
        setNome(d.cliente && d.cliente.responsavel ? d.cliente.responsavel : '');
        if(!d.senha) setDesbloqueado(true); // links antigos, gerados antes da senha existir, continuam funcionando sem pedir senha
      }catch(e){ console.error(e); setDecodeError(true); }
    })();
  }, [shareId]);

  const confirmarSenha = () => {
    if(senhaDigitada.trim() === String(decoded.senha)){
      setSenhaErro('');
      setDesbloqueado(true);
    } else {
      setSenhaErro('Senha incorreta. Confira com quem te enviou o link.');
    }
  };

  const coletarMetadados = async () => {
    const meta = {
      userAgent: navigator.userAgent || '', idioma: navigator.language || '',
      resolucaoTela: `${window.screen.width}x${window.screen.height}`,
      fusoHorario: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
      ip: '', localizacao: ''
    };
    try{
      const ctrl = new AbortController();
      const timeout = setTimeout(()=>ctrl.abort(), 3500);
      const res = await fetch('https://ipapi.co/json/', { signal: ctrl.signal });
      clearTimeout(timeout);
      if(res.ok){
        const geo = await res.json();
        meta.ip = geo.ip || '';
        meta.localizacao = [geo.city, geo.region, geo.country_name].filter(Boolean).join('/');
      }
    }catch(e){ /* segue sem IP/localização */ }
    return meta;
  };

  const enviar = async () => {
    if(!nome.trim()){ setError('Informe o nome de quem está assinando.'); return; }
    if(!cpf.trim()){ setError('O CPF é obrigatório para assinar.'); return; }
    if(!validarCPF(cpf)){ setError('CPF inválido. Confira os números digitados.'); return; }
    if(!assinaturaImg){ setError('Assine no quadro acima antes de confirmar.'); return; }
    if(!aceite){ setError('É necessário confirmar a declaração de ciência para concluir.'); return; }
    setError(''); setEnviando(true);
    try{
      const metadados = await coletarMetadados();
      const db = getFirebaseDb();
      if(!db) throw new Error('Sistema de assinatura indisponível no momento.');
      await db.collection(SIGNATURES_COLLECTION).add({
        propostaId: decoded.id,
        numero: decoded.numero,
        clienteNome: decoded.cliente.razaoSocial,
        assinaturaCliente: {
          nome, cpf, cargo, documento, imagem: assinaturaImg,
          dataHora: new Date().toISOString(), ...metadados
        },
        criadoEm: new Date().toISOString(),
        aplicado: false
      });
      setEnviado(true);
    }catch(e){
      console.error(e);
      setError('Não foi possível enviar a assinatura. Verifique sua internet e tente novamente.');
    }finally{
      setEnviando(false);
    }
  };

  if(decodeError){
    return <div className="login-screen"><div className="login-card"><h1>Link inválido</h1><p className="login-sub">Este link de assinatura parece corrompido ou incompleto. Peça um novo link.</p></div></div>;
  }
  if(!decoded){
    return <div className="loading-screen"><div className="spinner"></div>Carregando proposta...</div>;
  }
  if(!desbloqueado){
    return (
      <div className="login-screen">
        <div className="login-card">
          <div className="login-mark"><img src={LOGO_BOXED} alt="AWP Plataformas" style={{width:180, borderRadius:10, boxShadow:'0 6px 18px rgba(0,0,0,.25)'}}/></div>
          <h1 style={{marginTop:14}}>Proposta nº {decoded.numero}</h1>
          <p className="login-sub">Digite a senha de acesso que você recebeu para revisar e assinar esta proposta.</p>
          <div className="field" style={{textAlign:'left'}}>
            <label>Senha de acesso</label>
            <input value={senhaDigitada}
              onChange={e=>setSenhaDigitada(e.target.value)}
              onKeyDown={e=>{ if(e.key==='Enter') confirmarSenha(); }}
              placeholder="Digite a senha recebida" autoFocus
              style={{fontSize:18, fontWeight:700, letterSpacing:'.1em', textAlign:'center'}}/>
          </div>
          {senhaErro && <div className="login-error">{senhaErro}</div>}
          <button className="btn btn-primary" style={{width:'100%', justifyContent:'center'}} onClick={confirmarSenha}>Continuar</button>
        </div>
      </div>
    );
  }
  if(enviado){
    return (
      <div className="login-screen">
        <div className="login-card">
          <div className="login-mark"><img src={LOGO_BOXED} alt="AWP Plataformas" style={{width:180, borderRadius:10, boxShadow:'0 6px 18px rgba(0,0,0,.25)'}}/></div>
          <h1 style={{marginTop:14}}>Assinatura enviada!</h1>
          <p className="login-sub">Obrigado, {nome.split(' ')[0]}. Sua assinatura da proposta nº {decoded.numero} foi registrada com sucesso. Pode fechar esta janela.</p>
        </div>
      </div>
    );
  }

  const total = decoded.itens.reduce((s,it)=> s + itemSubtotal(it), 0);
  const settingsForDoc = { ...DEFAULT_SETTINGS, ...decoded.s };

  return (
    <div style={{minHeight:'100vh', background:'var(--bg)', padding:'20px 12px 60px'}}>
      <div className="proposal-doc-wrap" style={{marginBottom:20}}>
        <ProposalDocument prop={decoded} settings={settingsForDoc} total={total}/>
      </div>
      <div className="proposal-doc-wrap">
        <div className="modal" style={{maxWidth:600, width:'100%', boxShadow:'var(--shadow)'}}>
          <h3>Assinatura eletrônica</h3>
          <p style={{marginBottom:12}}>Revise a proposta acima e assine abaixo para confirmar seu aceite.</p>
          <div className="grid2">
            <div className="field"><label>Nome completo</label><input value={nome} onChange={e=>setNome(e.target.value)}/></div>
            <div className="field"><label>Cargo/Função</label><input value={cargo} onChange={e=>setCargo(e.target.value)}/></div>
          </div>
          <div className="grid2">
            <div className="field"><label>CPF *</label><input value={cpf} onChange={e=>setCpf(e.target.value)} placeholder="000.000.000-00"/></div>
            <div className="field"><label>Documento (RG, opcional)</label><input value={documento} onChange={e=>setDocumento(e.target.value)}/></div>
          </div>
          <div className="field">
            <label>Assinatura</label>
            <SignatureCapture nome={nome} onChange={setAssinaturaImg}/>
          </div>
          <label style={{display:'flex', alignItems:'flex-start', gap:8, fontSize:12.5, margin:'10px 0 14px', cursor:'pointer'}}>
            <input type="checkbox" style={{width:'auto', marginTop:2}} checked={aceite} onChange={e=>setAceite(e.target.checked)}/>
            <span>Declaro ciência e concordância com as condições comerciais, operacionais e de segurança desta proposta, autorizando a emissão do contrato de locação.</span>
          </label>
          {error && <div className="login-error">{error}</div>}
          <div className="row">
            <button className="btn btn-primary" style={{width:'100%', justifyContent:'center'}} onClick={enviar} disabled={enviando}>
              {enviando ? 'Enviando...' : 'Confirmar assinatura'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

const urlParams = new URLSearchParams(window.location.search);
const assinarShareId = urlParams.get('assinar');

if(assinarShareId){
  ReactDOM.createRoot(document.getElementById('app')).render(<PublicSignPage shareId={assinarShareId}/>);
} else {
  ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
}
</script>

</body>
</html>
