<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWP Plataformas — Sistema de Locação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Dancing+Script:wght@500;700&family=Great+Vibes&family=Sacramento&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F2A4A;
    --navy-2:#15355C;
    --blue:#1B4F8C;
    --blue-light:#E8F0FA;
    --orange:#F2994A;
    --orange-dark:#D97B25;
    --yellow:#F2C94C;
    --bg:#F3F5F8;
    --card:#FFFFFF;
    --text:#182233;
    --muted:#647089;
    --border:#E2E6ED;
    --danger:#C0392B;
    --good:#2E8B57;
    --radius:10px;
    --shadow:0 1px 2px rgba(15,42,74,.06), 0 4px 16px rgba(15,42,74,.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans',-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:220px;flex:0 0 220px;
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;border-bottom:1px solid rgba(255,255,255,.1);}
  .brand-logo-img{width:100%;max-width:150px;height:auto;display:block;}
  .brand-sub{font-size:9.5px;color:var(--yellow);letter-spacing:.08em;text-transform:uppercase;}
  nav.tabs{padding:14px 10px;display:flex;flex-direction:column;gap:3px;flex:1;}
  nav.tabs button{
    display:flex;align-items:center;gap:10px;
    background:transparent;border:none;color:#C7D3E5;
    padding:10px 12px;border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:13.5px;font-weight:500;text-align:left;
    transition:background .12s, color .12s;
  }
  nav.tabs button svg{flex:0 0 17px;width:17px;height:17px;opacity:.85;}
  nav.tabs button:hover{background:rgba(255,255,255,.06);color:#fff;}
  nav.tabs button.active{background:var(--orange);color:#fff;}
  nav.tabs button.active svg{opacity:1;}
  .nav-label-short{display:none;}
  .nav-alert-dot{
    position:absolute;top:6px;right:10px;background:var(--danger);color:#fff;
    font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }
  .sidebar-foot{padding:14px 18px;font-size:10.5px;color:#7F8DA6;border-top:1px solid rgba(255,255,255,.08);}
  .sync-indicator{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#C7D3E5;margin-bottom:8px;font-weight:600;}
  .sync-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#7F8DA6;}
  .sync-dot.online{background:#2ECC71;box-shadow:0 0 0 2px rgba(46,204,113,.25);}
  .sync-dot.connecting{background:var(--yellow);animation:pulse 1.2s infinite;}
  .sync-dot.error{background:var(--danger);}
  .sync-dot.local{background:#7F8DA6;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* ---------- Mobile top bar (hidden on desktop) ---------- */
  .mobile-topbar{display:none;}
  .mobile-home{display:none;}

  /* ---------- Main ---------- */
  main{flex:1;min-width:0;padding:26px 32px 60px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
  .page-head h1{font-size:21px;margin:0 0 3px;font-weight:700;letter-spacing:-.01em;}
  .page-head p{margin:0;color:var(--muted);font-size:13px;}
  .btn{
    border:none;border-radius:8px;padding:9px 16px;font-family:inherit;
    font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:transform .06s, box-shadow .12s, opacity .12s;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-secondary{background:var(--blue-light);color:var(--blue);}
  .btn-secondary:hover{background:#DCE9FA;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--blue);color:var(--blue);}
  .btn-danger{background:transparent;color:var(--danger);}
  .btn-danger:hover{background:#FBEAE8;}
  .btn-sm{padding:6px 11px;font-size:12.5px;border-radius:6px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card + .card{margin-top:16px;}
  .card-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .card-head h2{font-size:14.5px;margin:0;font-weight:700;}
  .card-head .num{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;
    font-size:11px;font-weight:700;margin-right:8px;
  }
  .card-body{padding:16px 18px;}

  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.01em;}
  .field input, .field select, .field textarea{
    width:100%;border:1px solid var(--border);border-radius:7px;padding:8.5px 10px;
    font-family:inherit;font-size:13.5px;color:var(--text);background:#fff;
  }
  .field textarea{resize:vertical;min-height:64px;line-height:1.5;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px;}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0 14px;}
  @media(max-width:760px){.grid2,.grid3,.grid4{grid-template-columns:1fr;}}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
     border-bottom:1px solid var(--border);padding:8px 10px;font-weight:600;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .actions-cell{width:1%;white-space:nowrap;}
  .empty-state{padding:36px 20px;text-align:center;color:var(--muted);}
  .empty-state svg{width:38px;height:38px;opacity:.35;margin-bottom:10px;}
  .empty-state p{margin:0 0 12px;font-size:13.5px;}

  .badge{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge-blue{background:var(--blue-light);color:var(--blue);}
  .badge-green{background:#E4F5EC;color:var(--good);}
  .badge-orange{background:#FDECDA;color:var(--orange-dark);}
  .badge-gray{background:#EEF0F4;color:var(--muted);}
  .badge-red{background:#FBEAE8;color:var(--danger);}
  .badge-purple{background:#F1E8FB;color:#7B3FBF;}

  /* ---------- Análise de Faturamento ---------- */
  .stat-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:18px;}
  .stat-hero .label{font-size:12px;color:#B8C6DD;text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
  .stat-hero .row{display:flex;gap:36px;margin-top:14px;flex-wrap:wrap;}
  .stat-hero .big{font-size:26px;font-weight:700;}
  .stat-hero .small{font-size:11.5px;color:#9FB0CC;margin-top:3px;}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:1000px){.stats-grid{grid-template-columns:1fr 1fr;}}
  .stat-card{border-top:4px solid var(--border);}
  .stat-card-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .stat-card-count{font-size:28px;font-weight:700;color:var(--navy);margin:6px 0 12px;}
  .stat-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--border);}
  .stat-row span{color:var(--muted);}
  .stat-row b{color:var(--text);}
  .value-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--border);}
  .value-bar-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;}
  .legend-item{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .legend-item b{color:var(--text);}
  .legend-item .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}

  .search-row{display:flex;gap:10px;margin-bottom:14px;align-items:center;}
  .search-row input{flex:1;border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:13.5px;background:#fff;}
  .search-row input:focus{outline:2px solid var(--blue);border-color:var(--blue);}

  .row-actions{display:flex;gap:6px;justify-content:flex-end;}
  .icon-btn{background:transparent;border:none;cursor:pointer;padding:5px;border-radius:6px;color:var(--muted);display:inline-flex;}
  .icon-btn:hover{background:var(--blue-light);color:var(--blue);}
  .icon-btn.del:hover{background:#FBEAE8;color:var(--danger);}
  .icon-btn svg{width:15px;height:15px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(0);
    background:var(--navy);color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:999;display:flex;align-items:center;gap:8px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .item-row-card{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#FAFBFD;}
  .item-row-card .rm{float:right;}
  .total-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;padding:12px 18px;background:var(--blue-light);border-top:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);}
  .total-bar .label{font-size:12.5px;color:var(--muted);font-weight:600;}
  .total-bar .value{font-size:18px;font-weight:700;color:var(--navy);}

  .hint{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .divider{height:1px;background:var(--border);margin:16px 0;}

  select.machine-picker{font-weight:600;}

  /* ---------- Proposal preview / print ---------- */
  .proposal-shell{display:flex;gap:18px;align-items:flex-start;}
  .proposal-actions{flex:0 0 200px;position:sticky;top:26px;}
  .proposal-doc-wrap{flex:1;min-width:0;display:flex;justify-content:center;}
  .proposal-doc{
    width:794px;max-width:100%;background:#fff;box-shadow:var(--shadow);border:1px solid var(--border);
    padding:0 0 20px;color:#1a1a2e;font-size:12.5px;
  }
  .doc-header{text-align:center;padding:20px 50px 14px;background:linear-gradient(180deg,#F7F9FC 0%,#fff 100%);border-bottom:3px solid var(--orange);}
  .doc-logo{width:105px;margin:0 auto 8px;}
  .doc-tagline{font-size:10.5px;color:#5B6472;margin-bottom:2px;letter-spacing:.01em;}
  .doc-title{font-size:19px;font-weight:700;color:var(--navy);letter-spacing:.03em;margin:6px 0 0;}
  .doc-body{padding:0 50px;}
  .doc-sec{margin-top:15px;}
  .doc-sec-title{
    display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--navy);
    margin:0 0 6px;padding-bottom:5px;border-bottom:2px solid var(--blue-light);
  }
  .doc-sec-title .n{
    display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;
    background:var(--navy);color:#fff;font-size:10px;font-weight:700;flex:0 0 18px;
  }
  .doc-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .doc-table th, .doc-table td{border:1px solid #DCE3ED;padding:5px 9px;text-align:left;}
  .doc-table th{background:var(--navy);color:#fff;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;}
  .doc-table tbody tr:nth-child(even){background:#F7F9FC;}
  .doc-kv{border:1px solid #DCE3ED;border-radius:6px;overflow:hidden;}
  .doc-kv td{border-color:#E7EBF2;}
  .doc-kv td:first-child{background:#F2F5FA;font-weight:600;width:36%;color:var(--navy);font-size:11px;}
  .doc-intro{font-size:11.5px;color:#5B6472;margin:0 0 6px;}
  .doc-total-box{
    display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:8px;
    background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;
  }
  .doc-total-box .lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#B8C6DD;}
  .doc-total-box .val{font-size:15px;font-weight:700;color:var(--yellow);}
  .specs-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .spec-card{border:1px solid #DCE3ED;border-radius:8px;overflow:hidden;}
  .spec-card .spec-head{background:var(--blue);color:#fff;font-weight:700;font-size:11px;padding:5px 10px;}
  .spec-card table{width:100%;border-collapse:collapse;font-size:11px;}
  .spec-card td{padding:4px 10px;border-top:1px solid #EAEEF4;}
  .spec-card td:first-child{color:#5B6472;width:52%;}
  .spec-card td:last-child{font-weight:600;color:var(--navy);text-align:right;}
  .doc-list{margin:0;padding-left:16px;}
  .doc-list li{margin-bottom:3px;line-height:1.42;font-size:11.5px;}
  .doc-text{line-height:1.45;margin:0;font-size:11.5px;}
  .doc-sign-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-top:10px;}
  .doc-sign-grid .full{grid-column:1 / -1;}
  .doc-sign-grid .line{border-bottom:1px solid #9AA5B8;height:20px;}
  .doc-sign-grid .lbl{font-size:10px;color:#5B6472;margin-top:3px;letter-spacing:.02em;}
  .doc-signed-block{border:1px solid #DCE3ED;border-radius:8px;padding:9px 12px;background:#FAFBFD;}
  .doc-sign-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin-top:8px;}
  .doc-sign-col-title{font-size:10px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .doc-sign-grid-single{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;}
  .doc-sign-grid-single .line{border-bottom:1px solid #9AA5B8;height:18px;}
  .doc-sign-grid-single .lbl{font-size:10px;color:#5B6472;margin-top:2px;letter-spacing:.02em;}
  .doc-foot{text-align:center;font-size:9.5px;color:#8894A8;margin-top:16px;padding:10px 50px 0;border-top:1px solid #E2E6ED;}

  @media print{
    body *{visibility:hidden;}
    .proposal-doc, .proposal-doc *, .os-doc, .os-doc *{visibility:visible;}
    .proposal-doc, .os-doc{position:absolute;top:0;left:0;box-shadow:none;border:none;width:100%;padding:8px 24px;}
    @page{margin:10mm;}
  }

  /* ---------- OS - Ordem de Serviço ---------- */
  .os-doc{
    width:794px;max-width:100%;background:#fff;box-shadow:var(--shadow);border:1px solid var(--border);
    padding:30px 40px 28px;color:#1a1a2e;font-size:12.3px;
  }
  .os-header{display:flex;align-items:center;gap:16px;border-bottom:3px solid var(--orange);padding-bottom:14px;margin-bottom:16px;}
  .os-header img{width:120px;flex:0 0 auto;}
  .os-header-text{flex:1;min-width:0;}
  .os-header-text h1{font-size:19px;margin:0 0 4px;color:var(--navy);font-weight:700;}
  .os-header-text p{margin:0;font-size:10px;color:#5B6472;line-height:1.5;}
  .os-header-num{text-align:right;font-size:10.5px;color:var(--muted);flex:0 0 auto;line-height:1.6;}
  .os-header-num b{display:block;font-size:16px;color:var(--navy);}
  .os-row{display:flex;gap:8px;border-bottom:1px solid #DCE3ED;padding:5px 0;font-size:12px;}
  .os-row .lbl{font-weight:700;color:var(--navy);flex:0 0 auto;white-space:nowrap;}
  .os-row .val{flex:1;}
  .os-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
  .os-check .box{display:inline-block;border:1px solid #333;width:13px;height:13px;text-align:center;line-height:12px;font-size:9.5px;margin:0 6px 0 3px;font-weight:700;}
  .os-section-title{font-size:12.5px;font-weight:700;color:var(--navy);text-align:center;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
  .os-text-block{border:1px solid #DCE3ED;border-radius:6px;min-height:56px;padding:8px 10px;font-size:12px;line-height:1.6;white-space:pre-wrap;margin-bottom:14px;}
  .os-footer-grid{border:1px solid #DCE3ED;border-radius:8px;padding:11px 14px;margin-top:14px;font-size:11px;}
  .os-footer-grid .frow{display:flex;gap:16px;padding:3.5px 0;flex-wrap:wrap;}
  .os-footer-grid .frow > div{flex:1;min-width:150px;}
  .os-footer-grid b{color:var(--navy);}
  .os-decl-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px;font-size:10.5px;text-align:center;}
  .os-decl-grid .sign-line{border-bottom:1px solid #9AA5B8;height:38px;}
  .os-decl-grid p{margin:4px 0 0;font-weight:600;color:var(--navy);}
  .os-decl-grid .small{font-weight:400;color:#5B6472;font-size:9.5px;margin-top:4px;}

  /* ---------- Login ---------- */
  .login-screen{
    min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--navy) 0%, var(--navy-2) 55%, #1B4F8C 100%);
    padding:20px;
  }
  .login-card{
    background:#fff;border-radius:16px;padding:34px 32px;width:100%;max-width:380px;
    box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center;
  }
  .login-mark{margin:0 auto 12px;}
  .login-card h1{font-size:19px;margin:0 0 4px;font-weight:700;color:var(--navy);}
  .login-sub{font-size:12.5px;color:var(--muted);margin:0 0 22px;}
  .login-users{display:flex;flex-direction:column;gap:8px;}
  .login-user-btn{
    display:flex;align-items:center;gap:12px;text-align:left;
    border:1px solid var(--border);background:#FAFBFD;border-radius:10px;padding:11px 14px;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .login-user-btn:hover{border-color:var(--blue);background:var(--blue-light);}
  .login-avatar{
    width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.02em;
  }
  .login-selected{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:10px 12px;background:var(--blue-light);border-radius:10px;}
  .login-selected b{flex:1;text-align:left;font-size:14px;}
  .login-pass .field{text-align:left;}
  .login-error{color:var(--danger);font-size:12.5px;margin-bottom:12px;text-align:left;}

  /* ---------- Assinatura: geração a partir do nome (estilo Autentique) ---------- */
  .sig-mode-tabs{display:flex;gap:8px;margin-bottom:10px;}
  .sig-mode-tabs button{
    flex:1;padding:9px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;
    cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);
  }
  .sig-mode-tabs button.active{background:var(--blue-light);color:var(--blue);border-color:var(--blue);}
  .sig-style-tabs{display:flex;gap:8px;flex-wrap:wrap;}
  .sig-style-btn{
    flex:1;min-width:150px;padding:14px 10px;border-radius:8px;border:1.5px solid var(--border);
    background:#FAFBFD;cursor:pointer;font-size:24px;color:#182233;text-align:center;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .sig-style-btn.active{border-color:var(--blue);background:var(--blue-light);box-shadow:0 0 0 1px var(--blue) inset;}
  .sig-preview-box{
    border:1px dashed var(--border);border-radius:8px;padding:20px;text-align:center;
    min-height:90px;display:flex;align-items:center;justify-content:center;background:#FAFBFD;
  }
  .link-btn{background:none;border:none;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:underline;}

const fmtDateBR = (iso) => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
// Converte um timestamp ISO (salvo em UTC) para data/hora no fuso do navegador de quem está vendo (ex: Brasília)
const fmtDataHoraLocal = (isoString) => {
  if(!isoString) return { data:'', hora:'' };
  const d = new Date(isoString);
  if(isNaN(d.getTime())) return { data:'', hora:'' };
  return {
    data: d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric' }),
    hora: d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' })
  };
};
const fmtMoney = (n) => {
  const v = parseFloat(n);
  if (isNaN(v)) return 'R$ 0,00';
  return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
};
const parseMoneyInput = (v) => {
  if (typeof v === 'number') return v;
  const cleaned = (v||'').toString().replace(/[^\d,.-]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
};

// Elementos que nunca devem ser cortados ao meio entre duas páginas do PDF
const PDF_AVOID_SPLIT_SELECTOR = 'tr, .spec-card, .doc-signed-block, .doc-sign-cols, .os-row, .os-footer-grid .frow, .os-text-block, .doc-total-box';

async function renderizarPaginasPdf(node){
  const MARGEM_MM = 8; // margem de impressão em volta do conteúdo, em todas as páginas
  const canvas = await window.html2canvas(node, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF('p', 'mm', 'a4');
  const pdfWidth = pdf.internal.pageSize.getWidth();
  const pdfHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pdfWidth - MARGEM_MM*2;
  const pageContentHeightMm = pdfHeight - MARGEM_MM*2;
  const totalHeightMm = canvas.height * imgWidth / canvas.width;
  const pxPerMm = canvas.height / totalHeightMm;
  const pageHeightPx = pageContentHeightMm * pxPerMm;

  // Mapeia, em pixels do canvas, as faixas de todo elemento que não pode ser dividido entre páginas
  const nodeRect = node.getBoundingClientRect();
  const scale = canvas.width / node.offsetWidth;
  const avoidRanges = Array.from(node.querySelectorAll(PDF_AVOID_SPLIT_SELECTOR)).map(el => {
    const r = el.getBoundingClientRect();
    return {
      top: (r.top - nodeRect.top) * scale,
      bottom: (r.bottom - nodeRect.top) * scale
    };
  }).filter(r => r.bottom > r.top);

  // Calcula os pontos de corte de cada página, empurrando o corte pra cima quando ele cairia em cima de um elemento protegido
  const cortes = [];
  let cursor = 0;
  while(cursor < canvas.height - 1){
    let corte = Math.min(cursor + pageHeightPx, canvas.height);
    if(corte < canvas.height){
      for(const r of avoidRanges){
        if(r.top < corte && r.bottom > corte && r.top > cursor + 4){
          corte = r.top;
        }
      }
      if(corte <= cursor) corte = Math.min(cursor + pageHeightPx, canvas.height); // segurança contra loop infinito
    }
    cortes.push([cursor, corte]);
    cursor = corte;
  }

  cortes.forEach(([top, bottom], i) => {
    const sliceHeightPx = Math.max(1, Math.round(bottom - top));
    const sliceCanvas = document.createElement('canvas');
    sliceCanvas.width = canvas.width;
    sliceCanvas.height = sliceHeightPx;
    const ctx = sliceCanvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
    ctx.drawImage(canvas, 0, top, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
    const sliceImgData = sliceCanvas.toDataURL('image/jpeg', 0.95);
    const sliceHeightMm = sliceHeightPx / pxPerMm;
    if(i > 0) pdf.addPage();
    pdf.addImage(sliceImgData, 'JPEG', MARGEM_MM, MARGEM_MM, imgWidth, sliceHeightMm);
  });

  return pdf;
}

async function gerarPdfBlobDoNode(nodeId){
  const node = document.getElementById(nodeId);
  if(!node || !window.html2canvas || !window.jspdf){
    throw new Error('Biblioteca de PDF ainda não carregou. Aguarde alguns segundos e tente novamente.');
  }
  const pdf = await renderizarPaginasPdf(node);
  return pdf.output('blob');
}

async function gerarPdfDoNode(nodeId, filename, onError){
  try{
    const node = document.getElementById(nodeId);
    if(!node || !window.html2canvas || !window.jspdf){
      onError && onError('Biblioteca de PDF ainda não carregou. Aguarde alguns segundos e tente novamente.');
      return false;
    }
    const pdf = await renderizarPaginasPdf(node);
    pdf.save(filename);
    return true;
  }catch(e){
    console.error('Erro ao gerar PDF', e);
    onError && onError('Não foi possível gerar o PDF. Tente novamente ou use "Imprimir" do navegador.');
    return false;
  }
}

/* ---------------- Autentique (assinatura eletrônica com validade jurídica) ---------------- */
// A chamada passa por uma Cloud Function (ponte) para evitar bloqueio de CORS do navegador.
// Configurada em Configurações > Assinatura digital > URL da ponte (Cloud Function).

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(String(reader.result).split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function chamarPonteAutentique(proxyUrl, payload){
  if(!proxyUrl){
    throw new Error('Configure a URL da ponte (Cloud Function) em Configurações > Assinatura digital.');
  }
  const res = await fetch(proxyUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json;
}

async function autentiqueEnviarDocumento({apiKey, proxyUrl, pdfBlob, nomeDocumento, signerName, signerEmail, semEmail}){
  const query = `mutation CreateDocumentMutation($document: DocumentInput!, $signers: [SignerInput!]!, $file: Upload!) {
    createDocument(document: $document, signers: $signers, file: $file) {
      id
      name
      signatures { public_id name email link { short_link } }
    }
  }`;
  const signer = { email: signerEmail, name: signerName, action: 'SIGN' };
  if(semEmail) signer.delivery_method = 'DELIVERY_METHOD_LINK'; // gera o link sem disparar e-mail automático
  const variables = {
    document: { name: nomeDocumento },
    signers: [signer],
    file: null
  };

  const fileBase64 = await blobToBase64(pdfBlob);
  const json = await chamarPonteAutentique(proxyUrl, {
    apiKey, query, variables, fileBase64, fileName: `${nomeDocumento}.pdf`
  });
  if(json.errors && json.errors.length){
    throw new Error(json.errors[0].message || 'Erro ao enviar documento para assinatura.');
  }
  const doc = json.data && json.data.createDocument;
  if(!doc) throw new Error('Resposta inesperada da Autentique.');
  return {
    documentId: doc.id,
    signingLink: doc.signatures && doc.signatures[0] && doc.signatures[0].link ? doc.signatures[0].link.short_link : ''
  };
}

async function autentiqueConsultarStatus({apiKey, proxyUrl, documentId}){
  const query = `query GetDocument($id: UUID!) {
    document(id: $id) {
      id
      name
      signatures { name email signed { created_at } rejected { created_at } }
    }
  }`;
  const json = await chamarPonteAutentique(proxyUrl, { apiKey, query, variables: { id: documentId } });
  if(json.errors && json.errors.length){
    throw new Error(json.errors[0].message || 'Erro ao consultar status da assinatura.');
  }
  const doc = json.data && json.data.document;
  if(!doc) throw new Error('Documento não encontrado na Autentique.');
  const sig = doc.signatures && doc.signatures[0];
  if(!sig) return { status: 'desconhecido' };
  if(sig.signed && sig.signed.created_at) return { status: 'assinado', data: sig.signed.created_at };
  if(sig.rejected && sig.rejected.created_at) return { status: 'rejeitado', data: sig.rejected.created_at };
  return { status: 'pendente' };
}

function Login({users, onLogin, onChangePassword, notify}){
  const userList = users && users.length ? users : USERS;
  const [selected, setSelected] = useState(null);
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [mode, setMode] = useState('login'); // 'login' | 'change'
  const [curPw, setCurPw] = useState('');
  const [newPw, setNewPw] = useState('');
  const [confirmPw, setConfirmPw] = useState('');
  const [changeError, setChangeError] = useState('');
  const inputRef = useRef(null);

  useEffect(()=>{ if(selected && mode==='login' && inputRef.current) inputRef.current.focus(); }, [selected, mode]);

  const trySubmit = () => {
    const user = userList.find(u=>u.name===selected);
    if(user && user.password === password){
      setError('');
      onLogin(user.name);
    } else {
      setError('Senha incorreta. Tente novamente.');
      setPassword('');
    }
  };

  const openChangeMode = () => {
    setMode('change'); setError(''); setChangeError('');
    setCurPw(''); setNewPw(''); setConfirmPw('');
  };
  const cancelChangeMode = () => {
    setMode('login'); setChangeError('');
    setCurPw(''); setNewPw(''); setConfirmPw('');
  };

  const submitChangePassword = () => {
    const user = userList.find(u=>u.name===selected);
    if(!user || user.password !== curPw){
      setChangeError('Senha atual incorreta.');
      return;
    }
    if(!newPw || newPw.length < 4){
      setChangeError('A nova senha deve ter pelo menos 4 caracteres.');
      return;
    }
    if(newPw !== confirmPw){
      setChangeError('A confirmação não confere com a nova senha.');
      return;
    }
    onChangePassword(selected, newPw);
    notify && notify('Senha atualizada com sucesso. Faça login com a nova senha.');
    setMode('login'); setPassword(''); setChangeError('');
    setCurPw(''); setNewPw(''); setConfirmPw('');
  };

  return (
    <div className="login-screen">
      <div className="login-card">
        <div className="login-mark"><img src={LOGO_BOXED} alt="AWP Plataformas" style={{width:180, borderRadius:10, boxShadow:'0 6px 18px rgba(0,0,0,.25)'}}/></div>
        <h1 style={{marginTop:14}}>AWP Plataformas</h1>
        <p className="login-sub">Sistema de Locação — selecione seu usuário para entrar</p>

        {!selected ? (
          <div className="login-users">
            {userList.map(u=>(
              <button key={u.name} className="login-user-btn" onClick={()=>{setSelected(u.name); setError(''); setMode('login');}}>
                <span className="login-avatar">{u.name.split(' ').map(p=>p[0]).slice(0,2).join('')}</span>
                {u.name}
              </button>
            ))}
          </div>
        ) : mode==='login' ? (
          <div className="login-pass">
            <div className="login-selected">
              <span className="login-avatar">{selected.split(' ').map(p=>p[0]).slice(0,2).join('')}</span>
              <b>{selected}</b>
              <button className="link-btn" onClick={()=>{setSelected(null); setPassword(''); setError('');}}>trocar</button>
            </div>
            <div className="field">
              <label>Senha</label>
              <input ref={inputRef} type="password" value={password}
                onChange={e=>setPassword(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter') trySubmit(); }}
                placeholder="Digite sua senha"/>
            </div>
            {error && <div className="login-error">{error}</div>}
            <button className="btn btn-primary" style={{width:'100%', justifyContent:'center'}} onClick={trySubmit}>Entrar</button>
            <button className="link-btn" style={{display:'block', margin:'14px auto 0'}} onClick={openChangeMode}>Trocar minha senha</button>
          </div>
        ) : (
          <div className="login-pass">
            <div className="login-selected">
              <span className="login-avatar">{selected.split(' ').map(p=>p[0]).slice(0,2).join('')}</span>
              <b>{selected}</b>
            </div>
            <div className="field">
              <label>Senha atual</label>
              <input type="password" value={curPw} onChange={e=>setCurPw(e.target.value)} placeholder="Digite sua senha atual"/>
            </div>
            <div className="field">
              <label>Nova senha</label>
              <input type="password" value={newPw} onChange={e=>setNewPw(e.target.value)} placeholder="Mínimo 4 caracteres"/>
            </div>
            <div className="field">
              <label>Confirmar nova senha</label>
              <input type="password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter') submitChangePassword(); }}
                placeholder="Repita a nova senha"/>
            </div>
            {changeError && <div className="login-error">{changeError}</div>}
            <button className="btn btn-primary" style={{width:'100%', justifyContent:'center'}} onClick={submitChangePassword}>Salvar nova senha</button>
            <button className="link-btn" style={{display:'block', margin:'14px auto 0'}} onClick={cancelChangeMode}>Cancelar</button>
          </div>
        )}
      </div>
    </div>
  );
}

function useToast(){
  const [msg, setMsg] = useState(null);
  const timerRef = useRef(null);
  const show = (text) => {
    setMsg(text);
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(()=>setMsg(null), 2400);
  };
  return [msg, show];
}

/* ---------------- Storage hooks ---------------- */
async function loadAppData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      return {
        clients: parsed.clients || [],
        machines: parsed.machines || [],
        proposals: parsed.proposals || [],
        os: parsed.os || [],
        faturas: parsed.faturas || [],
        users: (parsed.users && parsed.users.length) ? parsed.users : USERS,
        settings: { ...DEFAULT_SETTINGS, ...(parsed.settings||{}) }
      };
    }
  }catch(e){ /* key not found yet */ }
  return { clients:[], machines:[], proposals:[], os:[], faturas:[], users:[...USERS], settings: {...DEFAULT_SETTINGS} };
}
async function persist(data){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(data), false);
    return true;
  }catch(e){
    console.error('Erro ao salvar', e);
    return false;
  }
}

function ClienteForm({client, onCancel, onSubmit}){
  const [form, setForm] = useState(client);
  const [lookupState, setLookupState] = useState('idle'); // idle | loading | error | success
  const set = (k,v) => setForm(f=>({...f, [k]:v}));
  const valid = form.razaoSocial.trim().length > 0;
  const lastLookedRef = useRef('');

  const [lookupDetail, setLookupDetail] = useState('');

  const fetchBrasilApi = async (digits) => {
    const res = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${digits}`);
    if(!res.ok) throw new Error('brasilapi:' + res.status);
    const d = await res.json();
    return {
      razaoSocial: d.razao_social || d.nome_fantasia || '',
      telefone: d.ddd_telefone_1 || '',
      email: d.email || '',
      endereco: [
        [d.descricao_tipo_de_logradouro, d.logradouro].filter(Boolean).join(' '),
        d.numero, d.bairro,
        d.municipio && d.uf ? `${d.municipio}/${d.uf}` : (d.municipio || d.uf || ''),
        d.cep ? `CEP: ${d.cep}` : ''
      ].filter(Boolean).join(', ')
    };
  };

  const fetchReceitaWs = async (digits) => {
    const res = await fetch(`https://www.receitaws.com.br/v1/cnpj/${digits}`);
    if(!res.ok) throw new Error('receitaws:' + res.status);
    const d = await res.json();
    if(d.status === 'ERROR') throw new Error(d.message || 'receitaws error');
    return {
      razaoSocial: d.nome || d.fantasia || '',
      telefone: d.telefone || '',
      email: d.email || '',
      endereco: [
        [d.logradouro, d.numero].filter(Boolean).join(', '),
        d.bairro,
        d.municipio && d.uf ? `${d.municipio}/${d.uf}` : (d.municipio || d.uf || ''),
        d.cep ? `CEP: ${d.cep}` : ''
      ].filter(Boolean).join(', ')
    };
  };

  const runLookup = async (digits) => {
    setLookupState('loading');
    setLookupDetail('');
    let result = null;
    let lastErr = null;
    for(const fn of [fetchBrasilApi, fetchReceitaWs]){
      try{ result = await fn(digits); break; }
      catch(e){ lastErr = e; }
    }
    if(result){
      setForm(f=>({
        ...f,
        razaoSocial: result.razaoSocial || f.razaoSocial,
        telefone: result.telefone || f.telefone,
        email: result.email || f.email,
        endereco: result.endereco || f.endereco,
      }));
      lastLookedRef.current = digits;
      setLookupState('success');
    } else {
      lastLookedRef.current = digits;
      setLookupState('error');
      const msg = (lastErr && lastErr.message) || '';
      setLookupDetail(msg.includes('Failed to fetch') || msg==='' || msg.includes('NetworkError')
        ? 'Não foi possível conectar ao serviço de consulta (a rede pode estar bloqueada neste preview). Baixe o arquivo e abra direto no navegador para usar a busca automática.'
        : 'CNPJ não encontrado nas bases consultadas. Confira o número ou preencha manualmente.');
    }
  };

  const lookupCnpj = () => {
    const digits = (form.cnpj||'').replace(/\D/g,'');
    if(digits.length !== 14){ setLookupState('error'); return; }
    runLookup(digits);
  };

  // Busca automática: assim que o CNPJ chegar a 14 dígitos, consulta sozinho (com pequeno atraso pra não disparar a cada tecla)
  useEffect(()=>{
    const digits = (form.cnpj||'').replace(/\D/g,'');
    if(digits.length === 14 && digits !== lastLookedRef.current){
      const t = setTimeout(()=>runLookup(digits), 500);
      return ()=>clearTimeout(t);
    }
    if(digits.length !== 14 && lookupState !== 'idle'){
      setLookupState('idle');
    }
  }, [form.cnpj]);

  return (
    <div>
      <div className="page-head">
        <div>
          <h1>{client.id ? 'Editar cliente' : 'Novo cliente'}</h1>
          <p>Preencha os dados do cliente para uso nas propostas.</p>
        </div>
      </div>
      <div className="card">
        <div className="card-body">
          <div className="grid2">
            <div className="field">
              <label>CNPJ / CPF</label>
              <div style={{display:'flex', gap:6}}>
                <input value={form.cnpj} onChange={e=>set('cnpj', e.target.value)} placeholder="Digite só os números: 21878266000101"/>
                <button type="button" className="btn btn-secondary btn-sm" style={{flex:'0 0 auto'}} onClick={lookupCnpj} disabled={lookupState==='loading'}>
                  {lookupState==='loading' ? 'Buscando...' : 'Buscar'}
                </button>
              </div>
              {lookupState==='loading' && <div className="hint">Consultando CNPJ na Receita Federal...</div>}
              {lookupState==='success' && <div className="hint" style={{color:'var(--good)'}}>Dados encontrados e preenchidos automaticamente.</div>}
              {lookupState==='error' && <div className="hint" style={{color:'var(--danger)'}}>{lookupDetail || 'CNPJ não encontrado. Preencha manualmente.'}</div>}
              {lookupState==='idle' && <div className="hint">Pode digitar com ou sem pontuação — assim que completar os 14 dígitos, a busca é automática.</div>}
            </div>
            <div className="field">
              <label>Telefone / WhatsApp</label>
              <input value={form.telefone} onChange={e=>set('telefone', e.target.value)} placeholder="(11) 99999-9999"/>
            </div>
          </div>
          <div className="field">
            <label>Razão social / Nome *</label>
            <input value={form.razaoSocial} onChange={e=>set('razaoSocial', e.target.value)} placeholder="Ex: LCS Construtora e Projetos Industriais Ltda"/>
          </div>
          <div className="grid2">
            <div className="field">
              <label>Inscrição Estadual</label>
              <input value={form.inscricaoEstadual} onChange={e=>set('inscricaoEstadual', e.target.value)} placeholder="Ex: 123.456.789.112 ou ISENTO"/>
            </div>
            <div className="field">
              <label>Inscrição Municipal</label>
              <input value={form.inscricaoMunicipal} onChange={e=>set('inscricaoMunicipal', e.target.value)} placeholder="Ex: 12345678"/>
            </div>
          </div>
          <div className="grid2">
            <div className="field">
              <label>E-mail</label>
              <input value={form.email} onChange={e=>set('email', e.target.value)} placeholder="contato@empresa.com.br"/>
            </div>
            <div className="field">
              <label>Responsável no local</label>
              <input value={form.responsavel} onChange={e=>set('responsavel', e.target.value)} placeholder="Nome do responsável"/>
            </div>
          </div>
          <div className="field">
            <label>Endereço de entrega</label>
            <textarea value={form.endereco} onChange={e=>set('endereco', e.target.value)} placeholder="Rua, número, bairro, cidade/UF, CEP"/>
          </div>
        </div>
        <div className="total-bar" style={{justifyContent:'flex-end', background:'#fff', borderTop:'1px solid var(--border)'}}>
          <button className="btn btn-ghost" onClick={onCancel}>Cancelar</button>
          <button className="btn btn-primary" disabled={!valid} onClick={()=>onSubmit({...form, id: form.id || uid()})}>
            <IconCheck width="15" height="15"/>Salvar cliente
          </button>
        </div>
      </div>
    </div>
  );
}

const STATUS_OPTIONS = ['Aguardando retorno cliente','Efetivada em andamento','Cancelada','Concluída'];
const STATUS_BADGE_CLASS = {
  'Aguardando retorno cliente': 'badge-orange',
  'Efetivada em andamento': 'badge-blue',
  'Cancelada': 'badge-red',
  'Concluída': 'badge-green',
};
function StatusBadge({status}){
  const s = status || STATUS_OPTIONS[0];
  return <span className={`badge ${STATUS_BADGE_CLASS[s] || 'badge-gray'}`}>{s}</span>;
}
function maxPeriodoFim(itens){
  const datas = (itens||[]).map(it=>it.periodoFim).filter(Boolean);
  if(!datas.length) return '';
  return datas.slice().sort().slice(-1)[0];
}
function diasParaExpirar(dataISO){
  if(!dataISO) return null;
  const hoje = new Date(todayISO()+'T00:00:00');
  const alvo = new Date(dataISO+'T00:00:00');
  return Math.round((alvo - hoje) / 86400000);
}
function getExpiracao(prop){
  return prop.dataExpiracao || maxPeriodoFim(prop.itens);
}
function isUrgente(prop, limiteDias){
  const status = prop.status || STATUS_OPTIONS[0];
  if(status !== 'Efetivada em andamento') return false;
  const exp = getExpiracao(prop);
  if(!exp) return false;
  const dias = diasParaExpirar(exp);
  return dias !== null && dias <= (limiteDias===undefined?5:limiteDias);
}
function ExpiracaoBadge({prop}){
  const status = prop.status || STATUS_OPTIONS[0];
  if(status !== 'Efetivada em andamento') return null;
  const exp = getExpiracao(prop);
  if(!exp) return <span className="badge badge-gray">Sem data de expiração</span>;
  const dias = diasParaExpirar(exp);
  let cls = 'badge-green', label = `Expira em ${dias} dia(s)`;
  if(dias < 0){ cls='badge-red'; label = `Expirado há ${Math.abs(dias)} dia(s)`; }
  else if(dias === 0){ cls='badge-red'; label = 'Expira hoje'; }
  else if(dias <= 5){ cls='badge-orange'; label = `Expira em ${dias} dia(s)`; }
  return <span className={`badge ${cls}`} title={`Vencimento: ${fmtDateBR(exp)}`}>{label}</span>;
}

function RenovacaoModal({prop, proposals, settings, currentUser, onClose, onConfirm}){
  const numeroBase = prop.numeroBase || prop.numero;
  const proximaRev = proposals.filter(p => (p.numeroBase||p.numero)===numeroBase && p.propostaOrigemId).length + 1;
  const novoNumero = `${numeroBase}-REV${proximaRev}`;

  const [itens, setItens] = useState(() => prop.itens.map(it => ({
    ...it, lineId: uid(), periodoInicio: '', periodoFim: ''
  })));
  const [consultor, setConsultor] = useState(currentUser || prop.consultor || '');
  const [error, setError] = useState('');

  const updateItem = (lineId, k, v) => setItens(prev => prev.map(it => it.lineId===lineId ? {...it, [k]:v} : it));
  const total = itens.reduce((s,it)=> s + itemSubtotal(it), 0);

  const confirmar = () => {
    if(itens.some(it => !it.periodoInicio || !it.periodoFim)){
      setError('Preencha o novo período de todos os itens.');
      return;
    }
    setError('');
    const maxFim = itens.reduce((max,it)=> (it.periodoFim > max ? it.periodoFim : max), itens[0].periodoFim);
    onConfirm({
      id: null,
      numero: novoNumero,
      numeroBase,
      propostaOrigemId: prop.id,
      data: todayISO(),
      validade: settings.defaultValidade,
      consultor,
      clienteId: prop.clienteId,
      cliente: prop.cliente,
      itens,
      transporte: prop.transporte, prazoEntrega: prop.prazoEntrega, pagamento: prop.pagamento,
      textoEntrega: prop.textoEntrega, textoDevolucao: prop.textoDevolucao,
      status: 'Efetivada em andamento',
      dataExpiracao: maxFim,
      renewalHistory: [],
      sublocacao: prop.sublocacao||false, fornecedorSublocacao: prop.fornecedorSublocacao||'',
      autentiqueDocId:'', autentiqueLink:'', autentiqueStatus:'', autentiqueEnviadoEm:'',
      assinaturaAwp: null, assinaturaCliente: null,
      createdAt: null
    });
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{maxWidth:640}} onClick={e=>e.stopPropagation()}>
        <h3>Renovar locação — gerar {novoNumero}</h3>
        <p style={{marginBottom:12, fontSize:13}}>
          Isso cria uma <b>proposta nova</b> ({novoNumero}), vinculada à proposta nº {prop.numero}, com o período e os valores que você definir abaixo —
          a proposta original não é alterada. A nova proposta é independente: gera seu próprio PDF e precisa de assinatura própria.
        </p>
        <div className="field"><label>Consultor responsável</label><input value={consultor} onChange={e=>setConsultor(e.target.value)}/></div>
        {itens.map((it)=>(
          <div className="item-row-card" key={it.lineId}>
            <b style={{fontSize:12.5}}>{it.tipo} – {it.modelo}</b>
            <div className="grid2" style={{marginTop:8}}>
              <div className="field"><label>Novo início</label><input type="date" value={it.periodoInicio} onChange={e=>updateItem(it.lineId,'periodoInicio',e.target.value)}/></div>
              <div className="field"><label>Novo fim</label><input type="date" value={it.periodoFim} onChange={e=>updateItem(it.lineId,'periodoFim',e.target.value)}/></div>
            </div>
            <div className="grid3">
              <div className="field"><label>Valor locação (R$)</label><input value={it.valorLocacao} onChange={e=>updateItem(it.lineId,'valorLocacao',e.target.value)}/></div>
              <div className="field"><label>Seguro (R$)</label><input value={it.seguro} onChange={e=>updateItem(it.lineId,'seguro',e.target.value)} placeholder="Deixe em branco se não houver"/></div>
              <div className="field"><label>Frete (R$)</label><input value={it.frete} onChange={e=>updateItem(it.lineId,'frete',e.target.value)} placeholder="Deixe em branco se não houver"/></div>
            </div>
          </div>
        ))}
        <div className="total-bar" style={{background:'var(--blue-light)', borderRadius:8}}>
          <span className="label">Novo total</span>
          <span className="value">{fmtMoney(total)}</span>
        </div>
        {error && <div className="login-error" style={{marginTop:10}}>{error}</div>}
        <div className="row" style={{marginTop:14}}>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={confirmar}>Gerar proposta de renovação</button>
        </div>
      </div>
    </div>
  );
}

function PropostaForm({clients, machines, settings, initial, onCancel, onSave, notify}){
  const [prop, setProp] = useState(initial);
  const [showPreview, setShowPreview] = useState(false);
  const set = (k,v) => setProp(p=>({...p, [k]:v}));

  useEffect(()=>{
    if(!prop.dataExpiracao){
      const sugerida = maxPeriodoFim(prop.itens);
      if(sugerida) setProp(p=> p.dataExpiracao ? p : ({...p, dataExpiracao: sugerida}));
    }
  }, [prop.itens]);

  const selectClient = (id) => {
    const c = clients.find(x=>x.id===id);
    if(c){
      setProp(p=>({...p, clienteId:id, cliente:{
        razaoSocial:c.razaoSocial, cnpj:c.cnpj, inscricaoEstadual:c.inscricaoEstadual||'', inscricaoMunicipal:c.inscricaoMunicipal||'',
        telefone:c.telefone, email:c.email, endereco:c.endereco, responsavel:c.responsavel
      }}));
    } else {
      setProp(p=>({...p, clienteId:'', cliente:{razaoSocial:'', cnpj:'', inscricaoEstadual:'', inscricaoMunicipal:'', telefone:'', email:'', endereco:'', responsavel:''}}));
    }
  };

  const updateClienteField = (k,v) => setProp(p=>({...p, cliente:{...p.cliente, [k]:v}}));

  const addItem = () => setProp(p=>({...p, itens:[...p.itens, novoItem(null)]}));
  const addItemFromMachine = (machineId) => {
    const m = machines.find(x=>x.id===machineId);
    if(!m) return;
    setProp(p=>({...p, itens:[...p.itens, novoItem(m)]}));
  };
  const updateItem = (lineId, k, v) => {
    setProp(p=>({...p, itens: p.itens.map(it => it.lineId===lineId ? {...it, [k]:v} : it)}));
  };
  const selectMachineForItem = (lineId, machineId) => {
    const m = machines.find(x=>x.id===machineId);
    setProp(p=>({...p, itens: p.itens.map(it => {
      if(it.lineId!==lineId) return it;
      if(!m) return {...it, machineId:'', modelo:'', tipo:'', numeroSerie:'', patrimonio:'', alturaTrabalho:'', alturaPlataforma:'', alcanceHorizontal:'', capacidadeCarga:'', dimensoesPeso:'', energia:''};
      return {...it, machineId:m.id, modelo:m.modelo, tipo:m.tipo, marca:m.marca, numeroSerie:m.numeroSerie||'', patrimonio:m.patrimonio||'',
        alturaTrabalho:m.alturaTrabalho||'', alturaPlataforma:m.alturaPlataforma||'',
        alcanceHorizontal:m.alcanceHorizontal||'', capacidadeCarga:m.capacidadeCarga||'', dimensoesPeso:m.dimensoesPeso||'', energia:m.energia||'',
        valorLocacao: it.valorLocacao || m.valorPadrao || ''};
    })}));
  };
  const removeItem = (lineId) => setProp(p=>({...p, itens: p.itens.filter(it=>it.lineId!==lineId)}));

  const canGenerate = prop.cliente.razaoSocial.trim().length>0 && prop.itens.length>0 && prop.itens.every(it=>it.modelo && it.periodoInicio && it.periodoFim);

  if(showPreview){
    return <PropostaPreview
      prop={prop}
      settings={settings}
      total={total}
      onBack={()=>setShowPreview(false)}

const SIGNATURE_FONTS = [

function renderTextSignature(text, fontFamily){
  const canvas = document.createElement('canvas');
  canvas.width = 560; canvas.height = 200;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#182233';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let fontSize = 68;
  ctx.font = `${fontSize}px ${fontFamily}`;
  while(ctx.measureText(text).width > canvas.width - 50 && fontSize > 22){
    fontSize -= 2;
    ctx.font = `${fontSize}px ${fontFamily}`;
  }
  ctx.fillText(text, canvas.width/2, canvas.height/2 + 6);
  return canvas.toDataURL('image/png');
}

function SignatureCapture({nome, onChange}){
  const [mode, setMode] = useState('typed'); // 'typed' | 'draw'
  const [fontId, setFontId] = useState(SIGNATURE_FONTS[0].id);
  const font = SIGNATURE_FONTS.find(f=>f.id===fontId);

  useEffect(()=>{
    if(mode !== 'typed') return;
    let cancelled = false;
    (async () => {

      try{ await document.fonts.load(`64px ${font.family}`); }catch(e){}
      if(cancelled) return;

    })();
    return () => { cancelled = true; };
  }, [nome, fontId, mode]);

  return (
    <div>

        ) : (
          <div className="sig-style-tabs">
            {SIGNATURE_FONTS.map(f=>(
              <button key={f.id} type="button"
                className={`sig-style-btn ${fontId===f.id ? 'active' : ''}`}
                onClick={()=>setFontId(f.id)} style={{fontFamily:f.family}}>

            ))}

        )

      )}
    </div>
  );

function SignaturePad({onChange}){
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const lastPos = useRef({x:0, y:0});
  const [empty, setEmpty] = useState(true);

  const getPos = (e) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * (canvas.width/rect.width), y: (clientY - rect.top) * (canvas.height/rect.height) };
  };

  const start = (e) => {
    e.preventDefault();
    drawingRef.current = true;
    lastPos.current = getPos(e);
  };
  const move = (e) => {
    if(!drawingRef.current) return;
    e.preventDefault();
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const pos = getPos(e);
    ctx.strokeStyle = '#182233';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(lastPos.current.x, lastPos.current.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    lastPos.current = pos;
    if(empty) setEmpty(false);
  };
  const end = () => {
    if(!drawingRef.current) return;
    drawingRef.current = false;
    if(canvasRef.current) onChange(canvasRef.current.toDataURL('image/png'));
  };

  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    setEmpty(true);
    onChange('');
  };

  return (
    <div>
      <canvas
        ref={canvasRef}
        width={560} height={200}
        style={{width:'100%', height:160, background:'#FAFBFD', border:'1px dashed var(--border)', borderRadius:8, touchAction:'none', cursor:'crosshair'}}
        onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
        onTouchStart={start} onTouchMove={move} onTouchEnd={end}
      />
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:6}}>
        <span className="hint">Assine com o dedo ou o mouse na área acima</span>
        <button type="button" className="btn btn-ghost btn-sm" onClick={clear}>Limpar</button>
      </div>
    </div>
  );
}

function AssinaturaPresencialModal({prop, role, currentUser, onClose, onSave, notify}){
  const isAwp = role === 'awp';
  const [nome, setNome] = useState(isAwp ? (currentUser || '') : (prop.cliente.responsavel || ''));
  const [cpf, setCpf] = useState('');
  const [cargo, setCargo] = useState(isAwp ? 'Consultor AWP Plataformas' : '');
  const [documento, setDocumento] = useState('');
  const [assinaturaImg, setAssinaturaImg] = useState('');
  const [aceite, setAceite] = useState(false);
  const [error, setError] = useState('');
  const [salvando, setSalvando] = useState(false);

  const coletarMetadados = async () => {
    const meta = {
      userAgent: navigator.userAgent || '',
      idioma: navigator.language || '',
      resolucaoTela: `${window.screen.width}x${window.screen.height}`,
      fusoHorario: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
      ip: '', localizacao: ''
    };
    try{
      const ctrl = new AbortController();
      const timeout = setTimeout(()=>ctrl.abort(), 3500);
      const res = await fetch('https://ipapi.co/json/', { signal: ctrl.signal });
      clearTimeout(timeout);
      if(res.ok){
        const geo = await res.json();
        meta.ip = geo.ip || '';
        meta.localizacao = [geo.city, geo.region, geo.country_name].filter(Boolean).join('/');
      }
    }catch(e){ /* rede indisponível ou bloqueada — segue sem IP/localização, o resto da trilha continua válida */ }
    return meta;
  };

  const confirmar = async () => {
    if(!nome.trim()){ setError('Informe o nome de quem está assinando.'); return; }
    if(!cpf.trim()){ setError('O CPF é obrigatório para assinar.'); return; }
    if(!validarCPF(cpf)){ setError('CPF inválido. Confira os números digitados.'); return; }
    if(!assinaturaImg){ setError('Colete a assinatura no quadro acima antes de confirmar.'); return; }
    if(!aceite){ setError('É necessário confirmar a declaração de ciência para concluir.'); return; }
    setError(''); setSalvando(true);
    const metadados = await coletarMetadados();
    const assinatura = {
      nome, cpf, cargo, documento,
      imagem: assinaturaImg,
      dataHora: new Date().toISOString(),
      ...metadados
    };
    onSave({
      ...prop,
      [isAwp ? 'assinaturaAwp' : 'assinaturaCliente']: assinatura
    });
    setSalvando(false);
    notify(`Assinatura ${isAwp ? 'do responsável AWP' : 'do cliente'} registrada, com trilha de auditoria!`);
    onClose();
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{maxWidth:480}} onClick={e=>e.stopPropagation()}>
        <h3>{isAwp ? 'Assinatura do responsável AWP' : 'Assinatura do cliente'}</h3>
        <p style={{marginBottom:12}}>
          {isAwp
            ? 'Assine como responsável pela AWP Plataformas nesta proposta.'
            : 'Passe o aparelho para o cliente assinar diretamente aqui, na hora do fechamento.'}
        </p>
        <div className="grid2">
          <div className="field"><label>Nome completo</label><input value={nome} onChange={e=>setNome(e.target.value)}/></div>
          <div className="field"><label>Cargo/Função</label><input value={cargo} onChange={e=>setCargo(e.target.value)}/></div>
        </div>
        <div className="grid2">
          <div className="field"><label>CPF *</label><input value={cpf} onChange={e=>setCpf(e.target.value)} placeholder="000.000.000-00"/></div>
          <div className="field"><label>Documento (RG, opcional)</label><input value={documento} onChange={e=>setDocumento(e.target.value)}/></div>
        </div>
        <div className="field">
          <label>Assinatura</label>
          <SignatureCapture nome={nome} onChange={setAssinaturaImg}/>
        </div>
        <label style={{display:'flex', alignItems:'flex-start', gap:8, fontSize:12.5, margin:'10px 0 14px', cursor:'pointer'}}>
          <input type="checkbox" style={{width:'auto', marginTop:2}} checked={aceite} onChange={e=>setAceite(e.target.checked)}/>
          <span>
            {isAwp
              ? 'Declaro que assino esta proposta como responsável pela AWP Plataformas, confirmando as condições comerciais e operacionais nela descritas.'
              : 'Declaro ciência e concordância com as condições comerciais, operacionais e de segurança desta proposta, autorizando a emissão do contrato de locação.'}
          </span>
        </label>
        <div className="hint" style={{marginBottom:10}}>Ao confirmar, o sistema também registra IP, localização aproximada, dispositivo e fuso horário como trilha de auditoria.</div>
        {error && <div className="login-error">{error}</div>}
        <div className="row">
          <button className="btn btn-ghost" onClick={onClose} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={confirmar} disabled={salvando}>{salvando ? 'Registrando...' : 'Confirmar assinatura'}</button>
        </div>
      </div>
    </div>
  );
}

function AssinaturaModal({prop, settings, onClose, onSave, notify}){
  const [signerName, setSignerName] = useState(prop.cliente.responsavel || prop.cliente.razaoSocial || '');
  const [signerEmail, setSignerEmail] = useState(prop.cliente.email || '');
  const [semEmail, setSemEmail] = useState(true); // por padrão, só gera o link — sem disparo automático de e-mail
  const [sending, setSending] = useState(false);
  const [checking, setChecking] = useState(false);
  const [result, setResult] = useState(prop.autentiqueLink ? { signingLink: prop.autentiqueLink, documentId: prop.autentiqueDocId } : null);
  const [statusInfo, setStatusInfo] = useState(prop.autentiqueStatus || '');
  const [error, setError] = useState('');

  const jaEnviado = !!prop.autentiqueDocId;

  const enviar = async () => {
    if(!signerEmail.trim()){ setError('Informe o e-mail do cliente (usado para vincular o link à pessoa certa).'); return; }
    setError(''); setSending(true);
    try{
      const pdfBlob = await gerarPdfBlobDoNode('proposal-doc-content');
      const nomeDoc = `Proposta ${prop.numero} - ${prop.cliente.razaoSocial}`;
      const res = await autentiqueEnviarDocumento({
        apiKey: settings.autentiqueApiKey, proxyUrl: settings.autentiqueProxyUrl, pdfBlob, nomeDocumento: nomeDoc,
        signerName: signerName || signerEmail, signerEmail, semEmail
      });
      setResult(res);
      onSave({...prop, autentiqueDocId: res.documentId, autentiqueLink: res.signingLink, autentiqueStatus: 'pendente', autentiqueEnviadoEm: new Date().toISOString()});
      notify(semEmail ? 'Link de assinatura gerado! Nenhum e-mail foi disparado.' : 'Documento enviado para assinatura! Link pronto para compartilhar.');
    }catch(e){
      console.error(e);
      setError(e.message || 'Não foi possível enviar para assinatura. Confira a chave de API nas Configurações.');
    }finally{
      setSending(false);
    }
  };

  const verificarStatus = async () => {
    if(!prop.autentiqueDocId) return;
    setChecking(true);
    try{
      const st = await autentiqueConsultarStatus({apiKey: settings.autentiqueApiKey, proxyUrl: settings.autentiqueProxyUrl, documentId: prop.autentiqueDocId});
      setStatusInfo(st.status);
      onSave({...prop, autentiqueStatus: st.status});
      notify(st.status==='assinado' ? 'Documento assinado! 🎉' : `Status: ${st.status}`);
    }catch(e){
      notify(e.message || 'Erro ao consultar status.');
    }finally{
      setChecking(false);
    }
  };

  const copyLink = async () => {
    try{ await navigator.clipboard.writeText(result.signingLink); notify('Link copiado! Cole no WhatsApp ou e-mail para o cliente.'); }
    catch(e){ notify('Não foi possível copiar automaticamente — selecione o link manualmente.'); }
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" style={{maxWidth:460}} onClick={e=>e.stopPropagation()}>
        <h3>Assinatura eletrônica</h3>
        {!settings.autentiqueApiKey ? (
          <p>Configure a chave de API da Autentique em <b>Configurações → Assinatura digital</b> antes de enviar.</p>
        ) : !settings.autentiqueProxyUrl ? (
          <>
            <p style={{marginBottom:10}}>
              O envio automático ainda depende da "ponte" (Cloud Function) para funcionar, e ela ainda não está configurada.
              Por enquanto, envie manualmente:
            </p>
            <ol style={{fontSize:13, lineHeight:1.7, paddingLeft:18, margin:'0 0 14px'}}>
              <li>Clique em <b>"Baixar PDF"</b> (botão no topo desta tela)</li>
              <li>Acesse <a href="https://autentique.com.br" target="_blank" rel="noopener">autentique.com.br</a> e faça login</li>
              <li>Envie o PDF baixado, escolha o signatário e o modo de envio (link, e-mail ou WhatsApp)</li>
            </ol>
            <div className="row"><button className="btn btn-primary" onClick={onClose}>Entendi</button></div>
          </>
        ) : (
          <>
            {!result ? (
              <>
                <p>Envia o PDF desta proposta para o cliente assinar eletronicamente, com validade jurídica (Autentique).</p>
                <div className="field">
                  <label>Nome do signatário</label>
                  <input value={signerName} onChange={e=>setSignerName(e.target.value)} placeholder="Nome do responsável pelo cliente"/>
                </div>
                <div className="field">
                  <label>E-mail do signatário</label>
                  <input value={signerEmail} onChange={e=>setSignerEmail(e.target.value)} placeholder="email@cliente.com.br"/>
                  <div className="hint">Usado só para vincular o link à pessoa certa — não precisa ser um e-mail que ela consulte.</div>
                </div>
                <label style={{display:'flex', alignItems:'flex-start', gap:8, fontSize:13, marginBottom:14, cursor:'pointer'}}>
                  <input type="checkbox" style={{width:'auto', marginTop:2}} checked={semEmail} onChange={e=>setSemEmail(e.target.checked)}/>
                  <span>Gerar só o link, <b>sem disparar e-mail automático</b> (você mesmo envia pelo WhatsApp)</span>

                {error && <div className="login-error">{error}</div>}
                <div className="row">

                  <button className="btn btn-primary" onClick={enviar} disabled={sending}>

                </div>

            )}

        )}
      </div>
    </div>
  );

function validarCPF(cpf){
  const d = (cpf||'').replace(/\D/g,'');
  if(d.length !== 11) return false;
  if(/^(\d)\1{10}$/.test(d)) return false; // todos os dígitos iguais — sempre inválido
  let soma = 0;
  for(let i=0;i<9;i++) soma += parseInt(d[i]) * (10-i);
  let resto = 11 - (soma % 11);
  if(resto >= 10) resto = 0;
  if(resto !== parseInt(d[9])) return false;
  soma = 0;
  for(let i=0;i<10;i++) soma += parseInt(d[i]) * (11-i);
  resto = 11 - (soma % 11);
  if(resto >= 10) resto = 0;
  if(resto !== parseInt(d[10])) return false;
  return true;
}

function gerarSenhaAleatoria(){
  return String(Math.floor(100000 + Math.random()*900000)); // código numérico de 6 dígitos, fácil de digitar/enviar
}

function LinkAssinaturaModal({prop, settings, onClose, notify}){
  const [link, setLink] = useState('');
  const [senha, setSenha] = useState('');
  const [gerando, setGerando] = useState(true);
  const [erro, setErro] = useState(false);

  useEffect(()=>{
    let cancelado = false;
    (async () => {
      try{
        const db = getFirebaseDb();
        if(!db) throw new Error('Nuvem indisponível para gerar o link.');
        const novaSenha = gerarSenhaAleatoria();
        const minimal = {...buildShareablePayload(prop, settings), senha: novaSenha};
        const docRef = await db.collection(SHARED_LINKS_COLLECTION).add(minimal);
        if(cancelado) return;
        setLink(`${window.location.origin}${window.location.pathname}?assinar=${docRef.id}`);
        setSenha(novaSenha);
      }catch(e){
        console.error('Erro ao gerar link de assinatura', e);
        if(!cancelado) setErro(true);
      }finally{
        if(!cancelado) setGerando(false);
      }
    })();
    return () => { cancelado = true; };
  }, [prop, settings]);

  const copyLink = async () => {
    try{ await navigator.clipboard.writeText(link); notify('Link copiado! Cole no WhatsApp ou e-mail para o cliente.'); }

    catch(e){ notify('Não foi possível copiar automaticamente — selecione a senha manualmente.'); }

  const copyTudo = async () => {
    try{
      await navigator.clipboard.writeText(`Link para assinar a proposta: ${link}\nSenha de acesso: ${senha}`);

          A assinatura volta automaticamente para esta proposta assim que ele confirmar.
        </p>
        {gerando ? (
          <p className="hint">Gerando link...</p>
        ) : erro ? (
          <p className="login-error">Não foi possível gerar o link. Verifique a conexão com a nuvem e tente novamente.</p>
        ) : (
          <>
            <div className="field">
              <label>Link</label>
              <input readOnly value={link} onFocus={e=>e.target.select()} style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:12.5}}/>
            </div>
            <div className="field">
              <label>Senha de acesso (peça o cliente digitar antes de assinar)</label>
              <input readOnly value={senha} onFocus={e=>e.target.select()} style={{fontFamily:"'IBM Plex Mono',monospace", fontSize:16, fontWeight:700, letterSpacing:'.1em', textAlign:'center'}}/>

            </div>
            <button type="button" className="btn btn-secondary btn-sm" style={{width:'100%', justifyContent:'center', marginBottom:14}} onClick={copyTudo}>

            </button>

        <div className="row" style={{flexWrap:'wrap'}}>
          <button className="btn btn-ghost" onClick={onClose}>Fechar</button>
          <button className="btn btn-secondary" onClick={copySenha} disabled={gerando || erro || !senha}>Copiar só a senha</button>

function AssinaturasRecebidas({proposals, onSaveProposal, notify}){
  const [pendentes, setPendentes] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(()=>{
    const db = getFirebaseDb();
    if(!db){ setLoading(false); return; }
    const unsub = db.collection(SIGNATURES_COLLECTION).where('aplicado','==', false).onSnapshot(
      (snap) => {
        setPendentes(snap.docs.map(d=>({id:d.id, ...d.data()})));
        setLoading(false);
      },
      (err) => { console.error(err); setLoading(false); }
    );
    return () => unsub();
  }, []);

  if(loading || pendentes.length===0) return null;

  const aplicar = async (item) => {
    const prop = proposals.find(p=>p.id===item.propostaId);
    if(!prop){ notify('Proposta original não encontrada (pode ter sido excluída).'); return; }
    onSaveProposal({...prop, assinaturaCliente: item.assinaturaCliente});
    const db = getFirebaseDb();
    if(db){ try{ await db.collection(SIGNATURES_COLLECTION).doc(item.id).update({aplicado:true}); }catch(e){ console.error(e); } }
    notify(`Assinatura de ${item.assinaturaCliente.nome} aplicada à proposta nº ${item.numero}.`);
  };

  const descartar = async (item) => {
    const db = getFirebaseDb();
    if(db){ try{ await db.collection(SIGNATURES_COLLECTION).doc(item.id).update({aplicado:true}); }catch(e){ console.error(e); } }
    notify('Assinatura descartada.');
  };

  return (
    <div className="card" style={{marginBottom:16, borderLeft:'4px solid var(--good)'}}>
      <div className="card-head"><h2>✍️ Assinaturas recebidas ({pendentes.length})</h2></div>
      <div className="card-body">
        {pendentes.map(item=>(
          <div key={item.id} className="item-row-card" style={{display:'flex', alignItems:'center', gap:12, flexWrap:'wrap'}}>
            <img src={item.assinaturaCliente.imagem} alt="assinatura" style={{height:36, background:'#fff', border:'1px solid var(--border)', borderRadius:4, padding:2}}/>
            <div style={{flex:1, minWidth:160}}>
              <b>{item.assinaturaCliente.nome}</b>
              <div className="hint">Proposta nº {item.numero} — {item.clienteNome} · {fmtDataHoraLocal(item.assinaturaCliente.dataHora).data}</div>
            </div>
            <div style={{display:'flex', gap:6}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>descartar(item)}>Descartar</button>
              <button className="btn btn-primary btn-sm" onClick={()=>aplicar(item)}>Aplicar à proposta</button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function PropostasTab({proposals, clients, machines, settings, currentUser, faturas, onSaveProposal, onDeleteProposal, onGoToFatura, onGerarFatura, notify}){
  const [mode, setMode] = useState('list'); // list | new | view
  const [current, setCurrent] = useState(null);
  const [query, setQuery] = useState('');
  const [statusFilter, setStatusFilter] = useState('todos');
  const [confirmDel, setConfirmDel] = useState(null);
  const [renewing, setRenewing] = useState(null);

  const filtered = proposals
    .slice()
    .sort((a,b)=> (b.createdAt||0) - (a.createdAt||0))
    .filter(p =>
      (p.cliente.razaoSocial||'').toLowerCase().includes(query.toLowerCase()) ||
      String(p.numero).includes(query)
    )
    .filter(p => statusFilter==='todos' || (p.status||STATUS_OPTIONS[0])===statusFilter);

  const urgentCount = proposals.filter(p=>isUrgente(p)).length;

  const iniciarRenovacao = (draft) => {
    setRenewing(null);
    setCurrent(draft);
    setMode('edit');
  };

  const changeStatusQuick = (p, newStatus) => {
    onSaveProposal({...p, status: newStatus});
    notify(`Status da proposta nº ${p.numero} atualizado.`);
  };

  if(mode==='new'){
    return <PropostaForm
      clients={clients} machines={machines} settings={settings}
      initial={{...novaProposta(settings, clients), consultor: currentUser || settings.defaultConsultor}}
      onCancel={()=>setMode('list')}
      notify={notify}
      onSave={(prop)=>{
        onSaveProposal(prop);
        setMode('list');
        notify(`Proposta nº ${prop.numero} salva com sucesso — fatura gerada automaticamente.`);
      }}
    />;
  }

  if(mode==='edit' && current){
    return <PropostaForm
      clients={clients} machines={machines} settings={settings}
      initial={current}
      onCancel={()=>setMode('list')}
      notify={notify}
      onSave={(prop)=>{
        const eraNova = !prop.id;
        onSaveProposal(prop);
        setMode('list');
        notify(eraNova ? `Proposta nº ${prop.numero} salva com sucesso — fatura gerada automaticamente.` : `Proposta nº ${prop.numero} atualizada.`);
      }}
    />;
  }

  if(mode==='view' && current){
    const total = current.itens.reduce((s,it)=> s + itemSubtotal(it), 0);
    return <>
      <PropostaViewer current={current} settings={settings} currentUser={currentUser} proposals={proposals} faturas={faturas} onGoToFatura={onGoToFatura} onGerarFatura={onGerarFatura} onBack={()=>setMode('list')} notify={notify}
        onSave={(updated)=>{ onSaveProposal(updated); setCurrent(updated); }}
        onOpenRelated={(id)=>{ const p = proposals.find(x=>x.id===id); if(p) setCurrent(p); }}
        onDuplicate={()=>{
          const novoNum = String(settings.nextProposalNumber||1);
          const dup = {...current, id:null, numero:novoNum, numeroBase:novoNum, propostaOrigemId:null, data: todayISO(), createdAt:null,
            status: STATUS_OPTIONS[0], dataExpiracao:'', renewalHistory:[],
            autentiqueDocId:'', autentiqueLink:'', autentiqueStatus:'', autentiqueEnviadoEm:'',
            assinaturaAwp:null, assinaturaCliente:null,
            itens: current.itens.map(it=>({...it, lineId: uid()}))};
          setCurrent(dup); setMode('edit');
        }}
        onRenew={()=>setRenewing(current)}
      />
      {renewing && <RenovacaoModal prop={renewing} proposals={proposals} settings={settings} currentUser={currentUser} onClose={()=>setRenewing(null)} onConfirm={iniciarRenovacao}/>}
    </>;
  }

  return (
    <div>
      <div className="page-head">
        <div>
          <h1>Propostas</h1>
          <p>Histórico de propostas de locação geradas.{urgentCount>0 && <span style={{color:'var(--danger)', fontWeight:600}}> {urgentCount} locação(ões) vencendo ou vencida(s).</span>}</p>
        </div>
        <button className="btn btn-primary" onClick={()=>setMode('new')}><IconPlus width="15" height="15"/>Nova proposta</button>
      </div>

      <AssinaturasRecebidas proposals={proposals} onSaveProposal={onSaveProposal} notify={notify}/>

      <div className="search-row">
        <IconSearch width="16" height="16" style={{color:'var(--muted)'}}/>
        <input placeholder="Buscar por nº ou cliente..." value={query} onChange={e=>setQuery(e.target.value)}/>
      </div>
      <div className="search-row" style={{marginTop:-6}}>
        <select value={statusFilter} onChange={e=>setStatusFilter(e.target.value)} style={{maxWidth:260}}>
          <option value="todos">Todos os status</option>
          {STATUS_OPTIONS.map(s=><option key={s} value={s}>{s}</option>)}
        </select>
      </div>

      <div className="card">
        {filtered.length===0 ? (
          <div className="empty-state">
            <IconDoc/>
            <p>{proposals.length===0 ? 'Nenhuma proposta gerada ainda.' : 'Nenhuma proposta encontrada para essa busca.'}</p>
            {proposals.length===0 && <button className="btn btn-secondary" onClick={()=>setMode('new')}>Gerar primeira proposta</button>}
          </div>
        ) : (
          <table className="rtable">
            <thead><tr><th>Nº</th><th>Cliente</th><th>Status</th><th>Vencimento</th><th>Total</th><th></th></tr></thead>
            <tbody>
              {filtered.map(p=>{
                const total = p.itens.reduce((s,it)=> s + itemSubtotal(it), 0);
                const status = p.status || STATUS_OPTIONS[0];
                const podeRenovar = status !== 'Cancelada';
                const temFatura = faturas && faturas.some(f=>f.propostaId===p.id);
                return (
                  <tr key={p.id}>
                    <td className="mono" data-label="Nº">#{p.numero}<div className="hint">{fmtDateBR(p.data)}</div></td>
                    <td data-label="Cliente"><b>{p.cliente.razaoSocial}</b>
                      <div style={{display:'flex', gap:4, flexWrap:'wrap', marginTop:3}}>
                        {p.propostaOrigemId && <span className="badge badge-blue">Renovação</span>}
                        {p.sublocacao && <span className="badge badge-purple">Sublocação</span>}
                        {p.assinaturaCliente && <span className="badge badge-green">Assinado</span>}
                        {!temFatura && <span className="badge badge-orange">Sem fatura</span>}
                      </div>
                    </td>
                    <td data-label="Status">
                      <select value={status} onChange={e=>changeStatusQuick(p, e.target.value)} style={{fontSize:12, padding:'5px 6px'}}>
                        {STATUS_OPTIONS.map(s=><option key={s} value={s}>{s}</option>)}
                      </select>
                    </td>
                    <td data-label="Vencimento"><ExpiracaoBadge prop={p}/></td>
                    <td className="mono" data-label="Total">{fmtMoney(total)}</td>
                    <td className="actions-cell">
                      <div className="row-actions">
                        {podeRenovar && <button className="icon-btn" title="Renovar locação" onClick={()=>setRenewing(p)}><IconRefresh/></button>}
                        {temFatura
                          ? <button className="icon-btn" title="Ver fatura" onClick={()=>onGoToFatura(faturas.find(f=>f.propostaId===p.id).id)}><IconReceipt/></button>
                          : <button className="icon-btn" title="Gerar fatura" onClick={()=>onGerarFatura(p)}><IconReceipt style={{color:'var(--orange-dark)'}}/></button>}
                        <button className="icon-btn" title="Visualizar" onClick={()=>{setCurrent(p); setMode('view');}}><IconEye/></button>
                        <button className="icon-btn" title="Editar" onClick={()=>{setCurrent(p); setMode('edit');}}><IconEdit/></button>
                        <button className="icon-btn del" title="Excluir" onClick={()=>setConfirmDel(p)}><IconTrash/></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      <ConfirmModal
        open={!!confirmDel}
        title="Excluir proposta"
        text={confirmDel ? `Tem certeza que deseja excluir a proposta nº ${confirmDel.numero} (${confirmDel.cliente.razaoSocial})?` : ''}
        onConfirm={()=>{ onDeleteProposal(confirmDel.id); notify('Proposta excluída.'); setConfirmDel(null); }}
        onCancel={()=>setConfirmDel(null)}
      />
      {renewing && <RenovacaoModal prop={renewing} proposals={proposals} settings={settings} currentUser={currentUser} onClose={()=>setRenewing(null)} onConfirm={iniciarRenovacao}/>}
    </div>
  );
}
